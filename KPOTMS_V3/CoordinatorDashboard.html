 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        KPOTMS - Coordinator Dashboard
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #1769c2,
                    #0f9f9a
                );

            color: #111827;
        }


        .page {

            width: 100%;

            min-height: 100vh;

            padding: 0;
        }


        .dashboard {

            width: 100%;

            min-height: 100vh;

            background: #ffffff;

            border-radius:
                0 0 22px 22px;

            overflow: hidden;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .header {

            display: flex;

            justify-content:
                space-between;

            align-items: flex-start;

            padding:
                28px 32px 24px 32px;

            background: #ffffff;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 18px;
        }


        .brand-logo {

            width: 66px;

            height: 54px;

            object-fit: contain;
        }


        .brand-title {

            margin: 0;

            color: #0d5fbd;

            font-size: 34px;

            font-weight: 700;

            letter-spacing: 0.3px;
        }


        .brand-subtitle {

            margin-top: 4px;

            color: #526174;

            font-size: 19px;
        }


        .welcome {

            padding-top: 8px;

            color: #374151;

            font-size: 20px;

            text-align: right;
        }


        .welcome strong {

            color: #075ebc;

            font-weight: 700;
        }


        /* =====================================================
           CONTROLS
           ===================================================== */

        .controls {

            display: flex;

            gap: 12px;

            padding:
                0 20px 18px 20px;
        }


        .button {

            border: none;

            border-radius: 9px;

            padding:
                14px 24px;

            font-size: 16px;

            cursor: pointer;

            transition:
                opacity 0.15s ease,
                transform 0.1s ease;
        }


        .button:hover {

            opacity: 0.9;
        }


        .button:active {

            transform:
                translateY(1px);
        }


        .button:disabled {

            opacity: 0.55;

            cursor: not-allowed;
        }


        .refresh-button {

            background: #1976d2;

            color: #ffffff;
        }


        .logout-button {

            background: #eeeeee;

            color: #222222;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        #message {

            min-height: 28px;

            padding:
                8px 20px;

            text-align: center;

            font-size: 18px;

            color: #526174;
        }


        .error-message {

            color: #d00000 !important;

            font-weight: 600;
        }


        /* =====================================================
           TABLE
           ===================================================== */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;

            padding:
                0 14px;
        }


        table {

            width: 100%;

            border-collapse:
                collapse;

            table-layout: auto;
        }


        thead th {

            background: #1769c2;

            color: #ffffff;

            font-size: 17px;

            font-weight: 700;

            padding:
                15px 12px;

            text-align: left;

            white-space: nowrap;
        }


        tbody td {

            padding:
                14px 12px;

            font-size: 17px;

            border-bottom:
                1px solid #d7dce3;

            white-space: nowrap;

            vertical-align: middle;
        }


        tbody tr:nth-child(even) {

            background:
                #f5f8fc;
        }


        tbody tr:hover {

            background:
                #e7f0ff;
        }


        .no {

            text-align: center;

            font-weight: 600;
        }


        .course {

            text-align: center;
        }


        .subject {

            color: #075ebc;

            font-weight: 500;
        }


        .meeting a {

            color: #075ebc;

            font-weight: 600;

            text-decoration: none;
        }


        .meeting a:hover {

            text-decoration: underline;
        }


        /* =====================================================
           STATUS
           ===================================================== */

        .status-cell {

            text-align: center;

            min-width: 230px;
        }


        .status-container {

            display: inline-flex;

            align-items: center;

            gap: 10px;
        }


        .status-badge {

            display: inline-block;

            min-width: 95px;

            padding:
                10px 16px;

            border-radius: 20px;

            font-size: 14px;

            font-weight: 700;

            text-align: center;
        }


        .status-open {

            background: #d8f5df;

            color: #087a36;
        }


        .status-closed {

            background: #ffdede;

            color: #c51f1f;
        }


        .status-button {

            border: none;

            border-radius: 8px;

            padding:
                10px 15px;

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;
        }


        .open-button {

            background: #11883e;
        }


        .close-button {

            background: #d5232a;
        }


        .status-button:hover {

            opacity: 0.88;
        }


        .status-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .footer {

            padding:
                24px 20px;

            text-align: center;

            color: #7b8794;

            font-size: 15px;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 800px) {

            .header {

                padding:
                    22px 18px;
            }


            .brand-title {

                font-size: 27px;
            }


            .brand-subtitle {

                font-size: 16px;
            }


            .welcome {

                font-size: 16px;
            }


            .brand-logo {

                width: 54px;

                height: 45px;
            }


            thead th,
            tbody td {

                font-size: 14px;

                padding:
                    11px 9px;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <div class="dashboard">


        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="header">

            <div class="brand">

                <img
                    src="images/logo.png"
                    alt="Kalviparavai"
                    class="brand-logo"
                    onerror="this.style.display='none';"
                >

                <div>

                    <h1 class="brand-title">
                        KALVIPARAVAI
                    </h1>

                    <div class="brand-subtitle">
                        Coordinator Dashboard
                    </div>

                </div>

            </div>


            <div class="welcome">

                Welcome,
                <strong id="coordinatorName">
                    Coordinator
                </strong>

            </div>

        </header>


        <!-- =================================================
             CONTROLS
             ================================================= -->

        <div class="controls">

            <button
                id="refreshButton"
                class="button refresh-button"
                type="button"
            >
                ↻ REFRESH
            </button>


            <button
                id="logoutButton"
                class="button logout-button"
                type="button"
            >
                LOGOUT
            </button>

        </div>


        <!-- =================================================
             MESSAGE
             ================================================= -->

        <div id="message">
            Loading live sessions...
        </div>


        <!-- =================================================
             TABLE
             ================================================= -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>No</th>

                        <th>
                            Subject Code
                        </th>

                        <th>
                            CourseID
                        </th>

                        <th>
                            Subject Name
                        </th>

                        <th>
                            Teacher
                        </th>

                        <th>
                            Meeting URL
                        </th>

                        <th>
                            Last Updated
                        </th>

                        <th>
                            Session Status
                        </th>

                    </tr>

                </thead>


                <tbody id="sessionTable">

                </tbody>

            </table>

        </div>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <div class="footer">
            KPOTMS Version 3.0
        </div>


    </div>

</div>


<script>


/* ==========================================================
   KPOTMS V3
   COORDINATOR DASHBOARD
   ========================================================== */


/* ==========================================================
   EXISTING PRODUCTION WEB APP
   ========================================================== */

const COORDINATOR_MANAGER_URL =
    "https://script.google.com/macros/s/AKfycbzxJ0qJ_uIVVCm_VZrCItEp6y_sniqVX52oD3WhTWwohuK_liNX8v9Wcm2IdEWbZbJs/exec";


/* ==========================================================
   GLOBAL SESSION ROWS
   ========================================================== */

window.currentSessionRows = {};


/* ==========================================================
   CLEAN VALUE
   ========================================================== */

function clean(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value).trim();

}


/* ==========================================================
   ESCAPE HTML
   ========================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================================
   ESCAPE ATTRIBUTE
   ========================================================== */

function escapeAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* ==========================================================
   NORMALIZE MEETING URL
   ========================================================== */

function normalizeMeetingURL(value) {

    let url =
        clean(value);


    if (!url) {

        return "";

    }


    const markdownMatch =
        url.match(
            /^\[([^\]]+)\]\(([^)]+)\)$/
        );


    if (markdownMatch) {

        url =
            markdownMatch[2];

    }


    return url.trim();

}


/* ==========================================================
   FORMAT DATE / TIME
   ========================================================== */

function formatDateTime(value) {

    const raw =
        clean(value);


    if (!raw) {

        return "—";

    }


    const date =
        new Date(raw);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return raw;

    }


    return date.toLocaleString();

}


/* ==========================================================
   CREATE STATUS DISPLAY
   ========================================================== */

function createStatusHTML(
    status,
    rowNumber
) {

    const normalized =
        clean(status)
            .toUpperCase();


    if (
        normalized === "OPEN"
    ) {

        return `

            <div class="status-container">

                <span
                    class="status-badge status-open"
                >
                    OPEN
                </span>

                <button
                    type="button"
                    class="status-button close-button"
                    onclick="changeSessionStatus(
                        ${rowNumber},
                        'CLOSED'
                    )"
                >
                    CLOSE
                </button>

            </div>

        `;

    }


    return `

        <div class="status-container">

            <span
                class="status-badge status-closed"
            >
                CLOSED
            </span>

            <button
                type="button"
                class="status-button open-button"
                onclick="changeSessionStatus(
                    ${rowNumber},
                    'OPEN'
                )"
            >
                OPEN
            </button>

        </div>

    `;

}


/* ==========================================================
   LOAD SESSIONS

   VERIFIED API:

       GET ?action=getSessions
   ========================================================== */

async function loadSessions() {

    const table =
        document.getElementById(
            "sessionTable"
        );


    const message =
        document.getElementById(
            "message"
        );


    const refreshButton =
        document.getElementById(
            "refreshButton"
        );


    table.innerHTML = "";


    window.currentSessionRows = {};


    message.className = "";


    message.textContent =
        "Loading live sessions...";


    refreshButton.disabled =
        true;


    try {

        const requestURL =
            COORDINATOR_MANAGER_URL +
            "?action=getSessions&_=" +
            Date.now();


        console.log(
            "Coordinator getSessions URL:",
            requestURL
        );


        const response =
            await fetch(
                requestURL,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to connect to Coordinator Server. HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "Coordinator getSessions response:",
            result
        );


        if (
            !result ||
            result.success !== true ||
            !Array.isArray(
                result.data
            )
        ) {

            throw new Error(
                result &&
                result.message
                    ? result.message
                    : "Invalid session data received from server."
            );

        }


        const sessions =
            result.data;


        let count = 0;


        for (
            let i = 0;
            i < sessions.length;
            i++
        ) {

            const session =
                sessions[i];


            /*
             * Exact property names returned
             * by the verified API.
             */

            const subjectCode =
                clean(
                    session.Subject_Code
                );


            /*
             * Ignore blank final row.
             */

            if (!subjectCode) {

                continue;

            }


            count++;


            const courseID =
                clean(
                    session.CourseID
                );


            const subjectName =
                clean(
                    session.Subject_Name
                );


            const teacher =
                clean(
                    session.Teacher
                );


            const meetingURL =
                normalizeMeetingURL(
                    session.Meeting_URL
                );


            const status =
                clean(
                    session.Session_Status
                )
                .toUpperCase();


            const lastUpdated =
                formatDateTime(
                    session.Last_Updated
                );


            /*
             * Store exact Subject Code.
             */

            window.currentSessionRows[
                count
            ] = {

                subjectCode:
                    subjectCode,

                subjectName:
                    subjectName

            };


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td class="no">
                    ${count}
                </td>

                <td>
                    ${escapeHTML(
                        subjectCode
                    )}
                </td>

                <td class="course">
                    ${escapeHTML(
                        courseID
                    )}
                </td>

                <td class="subject">
                    ${escapeHTML(
                        subjectName
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        teacher
                    )}
                </td>

                <td class="meeting">

                    ${
                        meetingURL
                        ?

                        `<a
                            href="${escapeAttribute(
                                meetingURL
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            OPEN LINK
                        </a>`

                        :

                        "—"
                    }

                </td>

                <td>
                    ${escapeHTML(
                        lastUpdated
                    )}
                </td>

                <td class="status-cell">

                    ${createStatusHTML(
                        status,
                        count
                    )}

                </td>

            `;


            table.appendChild(
                tr
            );

        }


        if (
            count === 0
        ) {

            message.textContent =
                "No valid sessions found.";

            return;

        }


        message.textContent =
            count +
            " subject sessions";


    }


    catch (error) {

        console.error(
            "Coordinator Dashboard error:",
            error
        );


        message.className =
            "error-message";


        message.textContent =
            "Unable to load live Class Master data.";

    }


    finally {

        refreshButton.disabled =
            false;

    }

}


/* ==========================================================
   CHANGE SESSION STATUS

   IMPORTANT:
   Subject_Code is now explicitly sent.

   We also send subjectCode for compatibility with
   the current Code.gs doGet().

   This avoids changing the rest of the application.
   ========================================================== */

async function changeSessionStatus(
    rowNumber,
    newStatus
) {

    const row =
        window.currentSessionRows[
            rowNumber
        ];


    if (!row) {

        alert(
            "Session information not found."
        );

        return;

    }


    /*
     * The displayed row contains the exact
     * Subject_Code returned by the API.
     */

    const Subject_Code =
        clean(
            row.subjectCode
        );


    if (!Subject_Code) {

        alert(
            "Subject Code is missing."
        );

        return;

    }


    newStatus =
        clean(
            newStatus
        )
        .toUpperCase();


    if (
        newStatus !== "OPEN" &&
        newStatus !== "CLOSED"
    ) {

        alert(
            "Invalid session status."
        );

        return;

    }


    const actionText =
        newStatus === "OPEN"
            ? "open"
            : "close";


    const confirmed =
        confirm(
            "Are you sure you want to " +
            actionText +
            " the session for " +
            row.subjectName +
            "?"
        );


    if (!confirmed) {

        return;

    }


    try {

        /*
         * ----------------------------------------------------
         * IMPORTANT
         *
         * Send Subject_Code explicitly.
         *
         * Also send subjectCode because the current
         * Code.gs doGet() presently reads:
         *
         *     e.parameter.subjectCode
         *
         * This gives us compatibility without disturbing
         * the rest of the application.
         * ----------------------------------------------------
         */

        const requestURL =
            COORDINATOR_MANAGER_URL +
            "?action=updateStatus" +
            "&Subject_Code=" +
            encodeURIComponent(
                Subject_Code
            ) +
            "&subjectCode=" +
            encodeURIComponent(
                Subject_Code
            ) +
            "&status=" +
            encodeURIComponent(
                newStatus
            ) +
            "&_=" +
            Date.now();


        console.log(
            "Coordinator updateStatus URL:",
            requestURL
        );


        const response =
            await fetch(
                requestURL,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to connect to Coordinator Server. HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "Coordinator updateStatus response:",
            result
        );


        if (
            !result ||
            result.success !== true
        ) {

            throw new Error(
                result &&
                result.message
                    ? result.message
                    : "Unable to update Session Status."
            );

        }


        /*
         * Code.gs may return its actual update result
         * inside result.data.
         */

        if (
            result.data &&
            result.data.success === false
        ) {

            throw new Error(
                result.data.message ||
                "Session Status update was rejected by the server."
            );

        }


        alert(
            "Session status updated successfully."
        );


        /*
         * Reload actual server data.
         */

        await loadSessions();

    }


    catch (error) {

        console.error(
            "Session status update error:",
            error
        );


        alert(
            "Unable to update Session Status.\n\n" +
            "Error: " +
            error.message
        );

    }

}


/* ==========================================================
   LOGOUT
   ========================================================== */

function logout() {

    try {

        sessionStorage.clear();

    }

    catch (error) {

        console.warn(
            "Unable to clear sessionStorage:",
            error
        );

    }


    try {

        localStorage.removeItem(
            "coordinatorName"
        );

        localStorage.removeItem(
            "coordinatorLoggedIn"
        );

    }

    catch (error) {

        console.warn(
            "Unable to clear localStorage:",
            error
        );

    }


    window.location.href =
        "index.html";

}


/* ==========================================================
   LOAD COORDINATOR NAME
   ========================================================== */

function loadCoordinatorName() {

    let name =
        "";


    try {

        name =
            sessionStorage.getItem(
                "coordinatorName"
            ) || "";


        if (!name) {

            name =
                localStorage.getItem(
                    "coordinatorName"
                ) || "";

        }

    }

    catch (error) {

        console.warn(
            "Unable to read coordinator name:",
            error
        );

    }


    name =
        clean(name);


    if (!name) {

        name =
            "Coordinator";

    }


    document.getElementById(
        "coordinatorName"
    ).textContent =
        name;

}


/* ==========================================================
   BUTTON EVENTS
   ========================================================== */

document
    .getElementById(
        "refreshButton"
    )
    .addEventListener(
        "click",
        loadSessions
    );


document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(
        "click",
        logout
    );


/* ==========================================================
   INITIALIZE
   ========================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadCoordinatorName();

        loadSessions();

    }
);


</script>


</body>

</html>
