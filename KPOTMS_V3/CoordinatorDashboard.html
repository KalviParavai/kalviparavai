 <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kalviparavai - Coordinator Dashboard</title>


<style>

/* ==========================================================
   KPOTMS V3.0
   COORDINATOR DASHBOARD
   ========================================================== */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

}


body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #0d47a1,
            #1976d2,
            #00acc1,
            #43a047
        );

    background-size: 400% 400%;

    animation:
        backgroundMove 15s ease infinite;

    padding: 20px;

}


@keyframes backgroundMove {

    0% {

        background-position:
            0% 50%;

    }

    50% {

        background-position:
            100% 50%;

    }

    100% {

        background-position:
            0% 50%;

    }

}


/* ==========================================================
   MAIN DASHBOARD CARD
   ========================================================== */

.dashboard {

    width: 100%;

    max-width: 1500px;

    margin: auto;

    background: #ffffff;

    border-radius: 18px;

    padding: 20px;

    box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.30);

}


/* ==========================================================
   HEADER
   ========================================================== */

.header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    flex-wrap: wrap;

    gap: 15px;

    padding:
        5px
        10px
        20px;

}


.brand {

    display: flex;

    align-items: center;

    gap: 15px;

}


.logo {

    width: 70px;

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: center;

}


.logo img {

    width: 65px;

    height: 65px;

    object-fit: contain;

}


.title {

    color: #1565c0;

    font-size: 28px;

    font-weight: 700;

}


.subtitle {

    color: #666666;

    font-size: 16px;

    margin-top: 2px;

}


.coordinator {

    text-align: right;

    color: #555555;

    font-size: 18px;

}


.coordinator strong {

    color: #1565c0;

}


/* ==========================================================
   ACTION BUTTONS
   ========================================================== */

.actions {

    display: flex;

    gap: 10px;

    margin-bottom: 18px;

}


.refresh-button,
.logout-button {

    border: none;

    border-radius: 8px;

    padding:
        11px
        20px;

    font-size: 15px;

    cursor: pointer;

}


.refresh-button {

    background: #1976d2;

    color: #ffffff;

}


.refresh-button:hover {

    background: #0d47a1;

}


.refresh-button:disabled {

    opacity: 0.6;

    cursor: not-allowed;

}


.logout-button {

    background: #eeeeee;

    color: #333333;

}


.logout-button:hover {

    background: #dddddd;

}


/* ==========================================================
   TABLE
   ========================================================== */

.table-wrap {

    width: 100%;

    overflow-x: auto;

}


table {

    width: 100%;

    border-collapse:
        collapse;

    min-width: 1100px;

}


thead th {

    background: #1565c0;

    color: #ffffff;

    padding:
        12px
        10px;

    text-align: left;

    font-size: 15px;

    white-space: nowrap;

}


tbody td {

    padding:
        10px;

    border-bottom:
        1px solid #dddddd;

    font-size: 14px;

    vertical-align: middle;

}


tbody tr:nth-child(even) {

    background: #f7f9fc;

}


tbody tr:hover {

    background: #e8f1ff;

}


.no {

    width: 50px;

    text-align: center;

    font-weight: 700;

}


.course {

    width: 80px;

    text-align: center;

}


.subject {

    font-weight: 600;

    color: #1565c0;

}


.teacher {

    white-space: nowrap;

}


.meeting {

    white-space: nowrap;

}


.meeting a {

    color: #1565c0;

    text-decoration: none;

    font-weight: 600;

}


.meeting a:hover {

    text-decoration: underline;

}


.updated {

    white-space: nowrap;

    color: #666666;

}


/* ==========================================================
   SESSION STATUS
   ========================================================== */

.status-cell {

    text-align: center;

    white-space: nowrap;

}


.status {

    display: inline-block;

    min-width: 78px;

    padding:
        6px
        11px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: 700;

    margin-right: 6px;

}


.status-open {

    background: #d9f7df;

    color: #16803c;

}


.status-closed {

    background: #ffe0e0;

    color: #c62828;

}


.status-button {

    border: none;

    border-radius: 7px;

    padding:
        7px
        12px;

    color: #ffffff;

    font-size: 12px;

    font-weight: 600;

    cursor: pointer;

}


.status-button:hover {

    opacity: 0.85;

}


.status-button:disabled {

    opacity: 0.5;

    cursor: not-allowed;

}


.open-button {

    background: #16803c;

}


.close-button {

    background: #c62828;

}


/* ==========================================================
   MESSAGE
   ========================================================== */

#message {

    text-align: center;

    padding:
        20px
        10px;

    color: #666666;

    font-size: 16px;

}


.error-message {

    color: #c62828 !important;

    font-weight: 600;

}


/* ==========================================================
   FOOTER
   ========================================================== */

.footer {

    text-align: center;

    margin-top: 5px;

    color: #888888;

    font-size: 13px;

}


/* ==========================================================
   MOBILE
   ========================================================== */

@media (max-width: 700px) {

    body {

        padding: 8px;

    }


    .dashboard {

        padding: 12px;

    }


    .header {

        align-items:
            flex-start;

    }


    .coordinator {

        text-align: left;

        font-size: 16px;

    }


    .title {

        font-size: 22px;

    }


    .subtitle {

        font-size: 14px;

    }


    .logo {

        width: 55px;

        height: 55px;

    }


    .logo img {

        width: 50px;

        height: 50px;

    }

}

</style>

</head>


<body>


<div class="dashboard">


    <!-- ==================================================
         HEADER
         ================================================== -->

    <div class="header">


        <div class="brand">


            <div class="logo">

                <img
                    src="images/logo.png"
                    alt="Kalviparavai Logo"
                >

            </div>


            <div>

                <div class="title">

                    KALVIPARAVAI

                </div>


                <div class="subtitle">

                    Coordinator Dashboard

                </div>

            </div>


        </div>


        <div class="coordinator">

            Welcome,

            <strong
                id="coordinatorName"
            >
                Coordinator
            </strong>

        </div>


    </div>


    <!-- ==================================================
         ACTIONS
         ================================================== -->

    <div class="actions">


        <button
            id="refreshButton"
            class="refresh-button"
            onclick="loadSessions()"
        >

            ↻ REFRESH

        </button>


        <button
            class="logout-button"
            onclick="logout()"
        >

            LOGOUT

        </button>


    </div>


    <!-- ==================================================
         SESSION TABLE
         ================================================== -->

    <div class="table-wrap">


        <table>


            <thead>

                <tr>

                    <th>No</th>

                    <th>
                        Subject Code
                    </th>

                    <th>
                        CourseID
                    </th>

                    <th>
                        Subject Name
                    </th>

                    <th>
                        Teacher
                    </th>

                    <th>
                        Meeting URL
                    </th>

                    <th>
                        Last Updated
                    </th>

                    <th>
                        Session Status
                    </th>

                </tr>

            </thead>


            <tbody
                id="sessionTable"
            >

            </tbody>


        </table>


    </div>


    <div
        id="message"
    >
        Loading sessions...
    </div>


    <div class="footer">

        KPOTMS Version 3.0

    </div>


</div>



<script>

/* ==========================================================
   KPOTMS V3.0
   COORDINATOR DASHBOARD

   FLOW

   GitHub Pages
        ↓
   CoordinatorDashboard.html
        ↓
   POST
        ↓
   Apps Script Web App
        ↓
   WebAPI.gs
        ↓
   CoordinatorManager.gs
        ↓
   04_Class_Master

   ========================================================== */


/* ==========================================================
   COORDINATOR DASHBOARD ACCESS GUARD
   ========================================================== */

(function checkCoordinatorAccess() {


    const loggedIn =
        sessionStorage.getItem(
            "kpotmsLoggedIn"
        );


    const role =
        sessionStorage.getItem(
            "kpotmsRole"
        );


    /*
     * Direct dashboard access is NOT allowed
     * unless a Coordinator is already logged in.
     */

    if (
        loggedIn !== "true" ||
        role !== "COORDINATOR"
    ) {


        sessionStorage.setItem(
            "kpotmsCoordinatorLoginAllowed",
            "true"
        );


        window.location.replace(
            "CoordinatorLogin.html"
        );


        return;

    }


})();


/* ==========================================================
   COORDINATOR WEB APP
   ========================================================== */

const COORDINATOR_MANAGER_URL =
"https://script.google.com/macros/s/AKfycbyBPI1tVuHujIpBJAH5N47pmszsscx51-aqdpsTmSXYy3YeYnPc2HnuGx2SWQJlKJfX/exec";


/* ==========================================================
   COORDINATOR NAME
   ========================================================== */

const savedName =
    sessionStorage.getItem(
        "coordinatorName"
    );


if (savedName) {


    document.getElementById(
        "coordinatorName"
    ).textContent =
        savedName;

}


/* ==========================================================
   CURRENT DISPLAYED SESSIONS
   ========================================================== */

window.currentSessionRows = {};


/* ==========================================================
   LOAD ALL SESSIONS
   ========================================================== */

async function loadSessions() {


    const table =
        document.getElementById(
            "sessionTable"
        );


    const message =
        document.getElementById(
            "message"
        );


    const refreshButton =
        document.getElementById(
            "refreshButton"
        );


    table.innerHTML = "";


    window.currentSessionRows = {};


    message.className = "";


    message.textContent =
        "Loading live sessions...";


    refreshButton.disabled =
        true;


    try {


        /* ==================================================
           V3 POST API REQUEST
           ================================================== */

        const response =
            await fetch(
                COORDINATOR_MANAGER_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body: JSON.stringify({

                        action:
                            "getAllSessions"

                    }),

                    cache:
                        "no-store"

                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to connect to Coordinator Server."
            );

        }


        const result =
            await response.json();


        console.log(
            "getAllSessions response:",
            result
        );


        /* ==================================================
           CURRENT WebAPI.gs RETURNS:

           [
               {
                   Subject_Code: 1,
                   CourseID: 1,
                   Subject_Name: "...",
                   Teacher: "...",
                   Meeting_URL: "...",
                   Session_Status: "...",
                   Last_Updated: "..."
               }
           ]
           ================================================== */


        if (!Array.isArray(result)) {


            /*
             * Also tolerate a wrapped response
             * if WebAPI.gs is changed later.
             */

            if (
                result &&
                result.success === true &&
                Array.isArray(
                    result.data
                )
            ) {

                renderSessions(
                    result.data
                );

                return;

            }


            throw new Error(
                result &&
                result.message

                    ?

                    result.message

                    :

                    "Invalid session data received from server."
            );

        }


        renderSessions(result);


    }


    catch (error) {


        console.error(
            "Coordinator Dashboard Error:",
            error
        );


        message.className =
            "error-message";


        message.textContent =
            "Unable to load live Class Master data.";


    }


    finally {


        refreshButton.disabled =
            false;

    }

}


/* ==========================================================
   RENDER SESSIONS
   ========================================================== */

function renderSessions(
    sessions
) {


    const table =
        document.getElementById(
            "sessionTable"
        );


    const message =
        document.getElementById(
            "message"
        );


    table.innerHTML = "";


    window.currentSessionRows = {};


    if (
        !Array.isArray(sessions)
    ) {

        throw new Error(
            "Session data is not an array."
        );

    }


    let count = 0;


    for (
        let i = 0;
        i < sessions.length;
        i++
    ) {


        const session =
            sessions[i];


        /*
         * ==================================================
         * ACTUAL BACKEND FIELD NAMES
         *
         * These names were confirmed by
         * testGetAllSessions().
         * ==================================================
         */

        const subjectCode =
            clean(
                session.Subject_Code
            );


        /*
         * Ignore blank final row.
         */

        if (
            subjectCode === ""
        ) {

            continue;

        }


        count++;


        const courseID =
            clean(
                session.CourseID
            );


        const subjectName =
            clean(
                session.Subject_Name
            );


        const teacher =
            clean(
                session.Teacher
            );


        const meetingURL =
            clean(
                session.Meeting_URL
            );


        const status =
            clean(
                session.Session_Status
            )
            .toUpperCase();


        const lastUpdated =
            formatDateTime(
                session.Last_Updated
            );


        /*
         * Store the actual Subject Code
         * for OPEN / CLOSE operations.
         */

        window.currentSessionRows[
            count
        ] = {

            subjectCode:
                subjectCode,

            subjectName:
                subjectName

        };


        const tr =
            document.createElement(
                "tr"
            );


        tr.innerHTML = `

            <td class="no">
                ${count}
            </td>


            <td>
                ${escapeHTML(
                    subjectCode
                )}
            </td>


            <td class="course">
                ${escapeHTML(
                    courseID
                )}
            </td>


            <td class="subject">
                ${escapeHTML(
                    subjectName
                )}
            </td>


            <td class="teacher">
                ${escapeHTML(
                    teacher
                )}
            </td>


            <td class="meeting">

                ${
                    meetingURL

                    ?

                    `<a
                        href="${escapeAttribute(
                            meetingURL
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        OPEN LINK
                    </a>`

                    :

                    "—"
                }

            </td>


            <td class="updated">

                ${escapeHTML(
                    lastUpdated
                )}

            </td>


            <td class="status-cell">

                ${createStatusHTML(
                    status,
                    count
                )}

            </td>

        `;


        table.appendChild(
            tr
        );

    }


    /* ==================================================
       RESULT MESSAGE
       ================================================== */

    if (count === 0) {


        message.textContent =
            "No valid sessions found.";


        return;

    }


    message.textContent =
        count +
        " subject sessions";


}


/* ==========================================================
   CREATE STATUS HTML
   ========================================================== */

function createStatusHTML(
    status,
    rowNumber
) {


    if (
        status === "OPEN"
    ) {


        return `

            <span
                class="status status-open"
            >
                OPEN
            </span>


            <button
                class="status-button close-button"
                onclick="changeStatus(
                    ${rowNumber},
                    'CLOSED'
                )"
            >
                CLOSE
            </button>

        `;

    }


    return `

        <span
            class="status status-closed"
        >
            CLOSED
        </span>


        <button
            class="status-button open-button"
            onclick="changeStatus(
                ${rowNumber},
                'OPEN'
            )"
        >
            OPEN
        </button>

    `;

}


/* ==========================================================
   CHANGE SESSION STATUS
   ========================================================== */

async function changeStatus(
    rowNumber,
    newStatus
) {


    const row =
        window.currentSessionRows[
            rowNumber
        ];


    if (!row) {


        alert(
            "Session row not found."
        );


        return;

    }


    const subjectCode =
        row.subjectCode;


    const subjectName =
        row.subjectName;


    const confirmed =
        confirm(
            "Change " +
            subjectName +
            " to " +
            newStatus +
            "?"
        );


    if (!confirmed) {

        return;

    }


    try {


        /*
         * Disable all status buttons
         * during the update.
         */

        const buttons =
            document.querySelectorAll(
                ".status-button"
            );


        buttons.forEach(
            function(button) {

                button.disabled =
                    true;

                button.style.opacity =
                    "0.6";

            }
        );


        /* ==================================================
           V3 POST API REQUEST
           ================================================== */

        const response =
            await fetch(
                COORDINATOR_MANAGER_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body: JSON.stringify({

                        action:
                            "updateSessionStatus",

                        subjectCode:
                            subjectCode,

                        status:
                            newStatus

                    }),

                    cache:
                        "no-store"

                }
            );


        if (!response.ok) {

            throw new Error(
                "Server connection failed."
            );

        }


        const result =
            await response.json();


        console.log(
            "updateSessionStatus response:",
            result
        );


        if (
            !result ||
            result.success !== true
        ) {


            throw new Error(
                result &&
                result.message

                    ?

                    result.message

                    :

                    "Session update failed."
            );

        }


        /*
         * IMPORTANT:
         *
         * Do not merely change the screen.
         *
         * Reload the real backend data
         * from 04_Class_Master.
         */

        await loadSessions();


        alert(
            subjectName +
            " is now " +
            newStatus +
            "."
        );


    }


    catch (error) {


        console.error(
            "Session update error:",
            error
        );


        alert(
            "Unable to update Session Status.\n\n" +
            error.message
        );


        /*
         * Restore the actual backend state.
         */

        await loadSessions();

    }

}


/* ==========================================================
   LOGOUT
   ========================================================== */

function logout() {


    /*
     * Coordinator identity
     */

    sessionStorage.removeItem(
        "coordinatorID"
    );


    sessionStorage.removeItem(
        "coordinatorName"
    );


    sessionStorage.removeItem(
        "coordinatorUserID"
    );


    /*
     * V3 authentication
     */

    sessionStorage.removeItem(
        "kpotmsLoggedIn"
    );


    sessionStorage.removeItem(
        "kpotmsRole"
    );


    sessionStorage.removeItem(
        "kpotmsCoordinatorLoginAllowed"
    );


    /*
     * Return to V3 Landing Page.
     */

    window.location.replace(
        "index.html"
    );

}


/* ==========================================================
   CLEAN VALUE
   ========================================================== */

function clean(value) {


    return String(
        value ?? ""
    ).trim();

}


/* ==========================================================
   FORMAT LAST UPDATED
   ========================================================== */

function formatDateTime(
    value
) {


    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ) {

        return "";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return clean(value);

    }


    return date.toLocaleString();

}


/* ==========================================================
   ESCAPE HTML
   ========================================================== */

function escapeHTML(
    value
) {


    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==========================================================
   ESCAPE URL ATTRIBUTE
   ========================================================== */

function escapeAttribute(
    value
) {


    return String(
        value ?? ""
    )

    .replace(
        /"/g,
        "%22"
    )

    .replace(
        /</g,
        "%3C"
    )

    .replace(
        />/g,
        "%3E"
    );

}


/* ==========================================================
   START DASHBOARD
   ========================================================== */

loadSessions();


</script>


</body>

</html>
