 <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kalviparavai - Coordinator Dashboard</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {

    min-height: 100vh;

    background: linear-gradient(
        135deg,
        #0D47A1,
        #1976D2,
        #00ACC1,
        #43A047
    );

    background-size: 400% 400%;

    animation: bgmove 15s ease infinite;

    padding: 20px;
}

@keyframes bgmove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}

.dashboard {

    width: 100%;

    max-width: 1500px;

    margin: auto;

    background: white;

    border-radius: 18px;

    padding: 20px;

    box-shadow: 0 15px 40px rgba(0,0,0,.30);
}

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    flex-wrap: wrap;

    gap: 10px;

    padding: 5px 10px 20px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 12px;
}

.logo {

    width: 60px;

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}

.logo img {

    width: 55px;

    height: 55px;

    object-fit: contain;
}

.title {

    color: #1565C0;

    font-size: 27px;

    font-weight: bold;
}

.subtitle {

    color: #666;

    font-size: 15px;
}

.coordinator {

    text-align: right;

    color: #555;
}

.coordinator strong {

    color: #1565C0;
}

.actions {

    display: flex;

    gap: 10px;

    margin-bottom: 15px;
}

.refresh-button,
.logout-button {

    border: none;

    border-radius: 8px;

    padding: 10px 18px;

    font-size: 14px;

    cursor: pointer;
}

.refresh-button {

    background: #1976D2;

    color: white;
}

.refresh-button:hover {

    background: #0D47A1;
}

.refresh-button:disabled {

    opacity: .6;

    cursor: not-allowed;
}

.logout-button {

    background: #eeeeee;

    color: #333;
}

.logout-button:hover {

    background: #dddddd;
}

.table-wrap {

    width: 100%;

    overflow-x: auto;
}

table {

    width: 100%;

    border-collapse: collapse;

    min-width: 1050px;
}

thead th {

    background: #1565C0;

    color: white;

    padding: 11px 8px;

    text-align: left;

    font-size: 14px;

    white-space: nowrap;
}

tbody td {

    padding: 9px 8px;

    border-bottom: 1px solid #ddd;

    font-size: 14px;

    vertical-align: middle;
}

tbody tr:nth-child(even) {

    background: #f7f9fc;
}

tbody tr:hover {

    background: #e8f1ff;
}

.no {

    width: 45px;

    text-align: center;

    font-weight: bold;
}

.course {

    width: 70px;

    text-align: center;
}

.subject {

    font-weight: 600;

    color: #1565C0;
}

.teacher {

    white-space: nowrap;
}

.meeting a {

    color: #1565C0;

    text-decoration: none;

    font-weight: 600;
}

.meeting a:hover {

    text-decoration: underline;
}

.updated {

    white-space: nowrap;

    color: #666;
}

.status-cell {

    text-align: center;

    white-space: nowrap;
}

.status {

    display: inline-block;

    min-width: 80px;

    padding: 5px 10px;

    border-radius: 20px;

    font-weight: bold;

    font-size: 12px;

    margin-right: 6px;
}

.status-open {

    background: #d9f7df;

    color: #16803c;
}

.status-closed {

    background: #ffe0e0;

    color: #c62828;
}

.status-button {

    border: none;

    border-radius: 7px;

    padding: 7px 11px;

    color: white;

    font-size: 12px;

    cursor: pointer;
}

.open-button {

    background: #16803c;
}

.close-button {

    background: #c62828;
}

.status-button:hover {

    opacity: .85;
}

.status-button:disabled {

    opacity: .5;

    cursor: not-allowed;
}

#message {

    text-align: center;

    padding: 20px;

    color: #666;
}

.error-message {

    color: #c62828 !important;

    font-weight: 600;
}

.footer {

    text-align: center;

    margin-top: 15px;

    color: #888;

    font-size: 13px;
}

@media(max-width:700px) {

    body {

        padding: 8px;
    }

    .dashboard {

        padding: 12px;
    }

    .header {

        align-items: flex-start;
    }

    .coordinator {

        text-align: left;
    }

    .title {

        font-size: 22px;
    }

}

</style>

</head>


<body>


<div class="dashboard">


    <!-- ==================================================
         HEADER
         ================================================== -->

    <div class="header">


        <div class="brand">

            <div class="logo">

                <img
                    src="images/logo.png"
                    alt="Kalviparavai Logo"
                >

            </div>

            <div>

                <div class="title">
                    KALVIPARAVAI
                </div>

                <div class="subtitle">
                    Coordinator Dashboard
                </div>

            </div>

        </div>


        <div class="coordinator">

            Welcome,

            <strong id="coordinatorName">
                Coordinator
            </strong>

        </div>


    </div>


    <!-- ==================================================
         ACTIONS
         ================================================== -->

    <div class="actions">

        <button
            id="refreshButton"
            class="refresh-button"
            onclick="loadSessions()"
        >
            ↻ REFRESH
        </button>


        <button
            class="logout-button"
            onclick="logout()"
        >
            LOGOUT
        </button>

    </div>


    <!-- ==================================================
         SESSION TABLE
         ================================================== -->

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>No</th>

                    <th>Subject Code</th>

                    <th>CourseID</th>

                    <th>Subject Name</th>

                    <th>Teacher</th>

                    <th>Meeting URL</th>

                    <th>Last Updated</th>

                    <th>Session Status</th>

                </tr>

            </thead>


            <tbody id="sessionTable">

            </tbody>

        </table>

    </div>


    <div id="message">
        Loading sessions...
    </div>


    <div class="footer">
        KPOTMS Version 3.0
    </div>


</div>


<script>

/* ==========================================================
   KPOTMS V3.0
   COORDINATOR DASHBOARD

   GitHub Pages
        ↓
   CoordinatorDashboard.html
        ↓
   POST
        ↓
   Apps Script Web App
        ↓
   WebAPI.gs
        ↓
   CoordinatorManager.gs
        ↓
   04_Class_Master

   ========================================================== */


/* ==========================================================
   ACCESS CONTROL
   ========================================================== */

(function checkCoordinatorAccess() {

    const loggedIn =
        sessionStorage.getItem(
            "kpotmsLoggedIn"
        );

    const role =
        sessionStorage.getItem(
            "kpotmsRole"
        );


    if (
        loggedIn !== "true" ||
        role !== "COORDINATOR"
    ) {

        sessionStorage.setItem(
            "kpotmsCoordinatorLoginAllowed",
            "true"
        );


        window.location.replace(
            "CoordinatorLogin.html"
        );


        return;

    }

})();


/* ==========================================================
   COORDINATOR WEB APP URL
   ========================================================== */
const COORDINATOR_MANAGER_URL =
"https://script.google.com/macros/s/AKfycbzxJ0qJ_uIVVCm_VZrCItEp6y_sniqVX52oD3WhTWwohuK_liNX8v9Wcm2IdEWbZbJs/exec";

/* ==========================================================
   COORDINATOR NAM
   ========================================================== */

const savedName =
    sessionStorage.getItem(
        "coordinatorName"
    );


if (savedName) {

    document.getElementById(
        "coordinatorName"
    ).textContent = savedName;

}


/* ==========================================================
   CURRENT SESSION ROWS
   ========================================================== */

window.currentSessionRows = {};


/* ==========================================================
   LOAD ALL SESSIONS
   ========================================================== */

 async function loadSessions() {

    const table =
        document.getElementById(
            "sessionTable"
        );

    const message =
        document.getElementById(
            "message"
        );

    const refreshButton =
        document.getElementById(
            "refreshButton"
        );


    table.innerHTML = "";

    window.currentSessionRows = {};

    message.className = "";

    message.textContent =
        "Loading live sessions...";

    refreshButton.disabled = true;


    try {

        const response =
            await fetch(
                COORDINATOR_MANAGER_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body: JSON.stringify({

                        action:
                            "getAllSessions"

                    }),

                    cache: "no-store"

                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to connect to Coordinator Server."
            );

        }


        const result =
            await response.json();


        console.log(
            "getAllSessions response:",
            result
        );


        /* ==================================================
           Validate API response
           ================================================== */

        let sessions = [];


        if (
            result &&
            result.success === true &&
            Array.isArray(result.data)
        ) {

            sessions =
                result.data;

        }

        else {

            throw new Error(
                result &&
                result.message
                    ? result.message
                    : "Invalid session data received from server."
            );

        }


        /* ==================================================
           No sessions
           ================================================== */

        if (sessions.length === 0) {

            message.textContent =
                "No sessions found.";

            return;

        }


        let count = 0;


        /* ==================================================
           Build session rows
           ================================================== */

        for (
            let i = 0;
            i < sessions.length;
            i++
        ) {

            const session =
                sessions[i];


            /* ----------------------------------------------
               IMPORTANT:
               API field names are exactly as returned by
               Code.gs / CoordinatorManager.gs
               ---------------------------------------------- */

            const subjectCode =
                clean(
                    session.Subject_Code
                );


            /* ----------------------------------------------
               Skip blank final spreadsheet row
               ---------------------------------------------- */

            if (
                subjectCode === ""
            ) {

                continue;

            }


            count++;


            const courseID =
                clean(
                    session.CourseID
                );


            const subjectName =
                clean(
                    session.Subject_Name
                );


            const teacher =
                clean(
                    session.Teacher
                );


            const meetingURL =
                clean(
                    session.Meeting_URL
                );


            const status =
                clean(
                    session.Session_Status
                )
                .toUpperCase();


            const lastUpdated =
                formatDateTime(
                    session.Last_Updated
                );


            /* ----------------------------------------------
               Store row information
               ---------------------------------------------- */

            window.currentSessionRows[count] = {

                subjectCode:
                    subjectCode,

                subjectName:
                    subjectName

            };


            /* ----------------------------------------------
               Create table row
               ---------------------------------------------- */

            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td class="no">
                    ${count}
                </td>


                <td>
                    ${escapeHTML(
                        subjectCode
                    )}
                </td>


                <td class="course">
                    ${escapeHTML(
                        courseID
                    )}
                </td>


                <td class="subject">
                    ${escapeHTML(
                        subjectName
                    )}
                </td>


                <td class="teacher">
                    ${escapeHTML(
                        teacher
                    )}
                </td>


                <td class="meeting">

                    ${
                        meetingURL

                        ?

                        `<a
                            href="${escapeAttribute(
                                meetingURL
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            OPEN LINK
                        </a>`

                        :

                        "—"
                    }

                </td>


                <td class="updated">
                    ${escapeHTML(
                        lastUpdated
                    )}
                </td>


                <td class="status-cell">

                    ${createStatusHTML(
                        status,
                        count
                    )}

                </td>

            `;


            table.appendChild(
                tr
            );

        }


        /* ==================================================
           All rows were blank
           ================================================== */

        if (count === 0) {

            message.textContent =
                "No valid sessions found.";

            return;

        }


        /* ==================================================
           Success
           ================================================== */

        message.textContent =
            count +
            " subject sessions";


    }


    catch (error) {

        console.error(
            "Coordinator Dashboard error:",
            error
        );


        message.className =
            "error-message";


        message.textContent =
            "Unable to load live Class Master data.";

    }


    finally {

        refreshButton.disabled = false;

    }

}
/* ==========================================================
   CREATE STATUS HTML
   ========================================================== */

function createStatusHTML(
    status,
    rowNumber
) {


    if (status === "OPEN") {

        return `

            <span class="status status-open">
                OPEN
            </span>

            <button
                class="status-button close-button"
                onclick="changeStatus(
                    ${rowNumber},
                    'CLOSED'
                )"
            >
                CLOSE
            </button>

        `;

    }


    return `

        <span class="status status-closed">
            CLOSED
        </span>

        <button
            class="status-button open-button"
            onclick="changeStatus(
                ${rowNumber},
                'OPEN'
            )"
        >
            OPEN
        </button>

    `;

}


/* ==========================================================
   OPEN / CLOSE SESSION
   ========================================================== */

async function changeStatus(
    rowNumber,
    newStatus
) {


    const row =
        window.currentSessionRows[
            rowNumber
        ];


    if (!row) {

        alert(
            "Session row not found."
        );

        return;

    }


    const subjectCode =
        String(
            row.subjectCode || ""
        ).trim();


    const subjectName =
        String(
            row.subjectName || ""
        ).trim();


    /*
     * IMPORTANT
     *
     * The backend error was:
     *
     * "Subject_Code is required."
     *
     * Therefore we validate BEFORE sending.
     */

    if (!subjectCode) {

        alert(
            "Unable to update Session Status.\n\n" +
            "Subject Code is missing from the selected row."
        );

        return;

    }


    const confirmed =
        confirm(
            "Change " +
            subjectName +
            " (Subject Code " +
            subjectCode +
            ") to " +
            newStatus +
            "?"
        );


    if (!confirmed) {

        return;

    }


    try {


        const buttons =
            document.querySelectorAll(
                ".status-button"
            );


        buttons.forEach(
            button => {

                button.disabled = true;

                button.style.opacity =
                    "0.6";

            }
        );


        /*
         * ==================================================
         * UPDATE SESSION STATUS
         *
         * We send BOTH naming conventions:
         *
         * subjectCode
         * Subject_Code
         *
         * status
         * Session_Status
         *
         * This keeps the V3 dashboard compatible with
         * the deployed Web API validation.
         * ==================================================
         */

        const requestBody = {

            action:
                "updateSessionStatus",

            subjectCode:
                subjectCode,

            Subject_Code:
                subjectCode,

            status:
                newStatus,

            Session_Status:
                newStatus

        };


        console.log(
            "updateSessionStatus request:",
            requestBody
        );

        const response =
         await fetch(
           COORDINATOR_MANAGER_URL +
            "?action=getSessions",
          {

               method: "GET",

              cache: "no-store"

         }
      );

        if (!response.ok) {

            throw new Error(
                "Server connection failed."
            );

        }


        const result =
            await response.json();


        console.log(
            "updateSessionStatus response:",
            result
        );


        if (
            !result ||
            result.success !== true
        ) {

            throw new Error(
                result &&
                (
                    result.message ||
                    result.error
                )

                    ?

                    (
                        result.message ||
                        result.error
                    )

                    :

                    "Session update failed."
            );

        }


        /*
         * Reload the actual backend data.
         */

        await loadSessions();


        alert(
            subjectName +
            " (Subject Code " +
            subjectCode +
            ") is now " +
            newStatus +
            "."
        );


    }


    catch (error) {

        console.error(
            "Session update error:",
            error
        );


        alert(
            "Unable to update Session Status.\n\n" +
            "Error: " +
            error.message
        );


        await loadSessions();

    }

}


/* ==========================================================
   LOGOUT
   ========================================================== */

function logout() {


    sessionStorage.removeItem(
        "coordinatorID"
    );


    sessionStorage.removeItem(
        "coordinatorName"
    );


    sessionStorage.removeItem(
        "coordinatorUserID"
    );


    sessionStorage.removeItem(
        "kpotmsLoggedIn"
    );


    sessionStorage.removeItem(
        "kpotmsRole"
    );


    sessionStorage.removeItem(
        "kpotmsCoordinatorLoginAllowed"
    );


    window.location.replace(
        "index.html"
    );

}


/* ==========================================================
   CLEAN VALUE
   ========================================================== */

function clean(value) {

    return String(
        value ?? ""
    ).trim();

}


/* ==========================================================
   FORMAT LAST UPDATED
   ========================================================== */

function formatDateTime(value) {


    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ) {

        return "";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return clean(value);

    }


    return date.toLocaleString();

}


/* ==========================================================
   ESCAPE HTML
   ========================================================== */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==========================================================
   ESCAPE URL ATTRIBUTE
   ========================================================== */

function escapeAttribute(value) {

    return String(
        value ?? ""
    )

    .replace(
        /"/g,
        "%22"
    )

    .replace(
        /</g,
        "%3C"
    )

    .replace(
        />/g,
        "%3E"
    );

}


/* ==========================================================
   LOAD DASHBOARD
   ========================================================== */

loadSessions();

</script>


</body>

</html>
