<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kalviparavai - Coordinator Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{

    min-height:100vh;

    background:linear-gradient(
        135deg,
        #0D47A1,
        #1976D2,
        #00ACC1,
        #43A047
    );

    background-size:400% 400%;

    animation:bgmove 15s ease infinite;

    padding:20px;

}

@keyframes bgmove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}


.dashboard{

    width:100%;

    max-width:1500px;

    margin:auto;

    background:white;

    border-radius:18px;

    padding:20px;

    box-shadow:0 15px 40px rgba(0,0,0,.30);

}


.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    flex-wrap:wrap;

    gap:10px;

    padding:5px 10px 20px;

}


.brand{

    display:flex;

    align-items:center;

    gap:12px;

}


.logo{

    font-size:45px;

}


.title{

    color:#1565C0;

    font-size:27px;

    font-weight:bold;

}


.subtitle{

    color:#666;

    font-size:15px;

}


.coordinator{

    text-align:right;

    color:#555;

}


.coordinator strong{

    color:#1565C0;

}


.actions{

    display:flex;

    gap:10px;

    margin-bottom:15px;

}


.refresh-button,
.logout-button{

    border:none;

    border-radius:8px;

    padding:10px 18px;

    font-size:14px;

    cursor:pointer;

}


.refresh-button{

    background:#1976D2;

    color:white;

}


.refresh-button:hover{

    background:#0D47A1;

}


.logout-button{

    background:#eeeeee;

    color:#333;

}


.table-wrap{

    width:100%;

    overflow-x:auto;

}


table{

    width:100%;

    border-collapse:collapse;

    min-width:1050px;

}


thead th{

    background:#1565C0;

    color:white;

    padding:11px 8px;

    text-align:left;

    font-size:14px;

    white-space:nowrap;

}


tbody td{

    padding:9px 8px;

    border-bottom:1px solid #ddd;

    font-size:14px;

    vertical-align:middle;

}


tbody tr:nth-child(even){

    background:#f7f9fc;

}


tbody tr:hover{

    background:#e8f1ff;

}


.no{

    width:45px;

    text-align:center;

    font-weight:bold;

}


.course{

    width:70px;

    text-align:center;

}


.subject{

    font-weight:600;

    color:#1565C0;

}


.teacher{

    white-space:nowrap;

}


.meeting a{

    color:#1565C0;

    text-decoration:none;

    font-weight:600;

}


.meeting a:hover{

    text-decoration:underline;

}


.updated{

    white-space:nowrap;

    color:#666;

}


.status-cell{

    text-align:center;

    white-space:nowrap;

}


.status{

    display:inline-block;

    min-width:80px;

    padding:5px 10px;

    border-radius:20px;

    font-weight:bold;

    font-size:12px;

    margin-right:6px;

}


.status-open{

    background:#d9f7df;

    color:#16803c;

}


.status-closed{

    background:#ffe0e0;

    color:#c62828;

}


.status-button{

    border:none;

    border-radius:7px;

    padding:7px 11px;

    color:white;

    font-size:12px;

    cursor:pointer;

}


.open-button{

    background:#16803c;

}


.close-button{

    background:#c62828;

}


.status-button:hover{

    opacity:.85;

}


#message{

    text-align:center;

    padding:20px;

    color:#666;

}


.footer{

    text-align:center;

    margin-top:15px;

    color:#888;

    font-size:13px;

}


/* Mobile */

@media(max-width:700px){

    body{

        padding:8px;

    }

    .dashboard{

        padding:12px;

    }

    .header{

        align-items:flex-start;

    }

    .coordinator{

        text-align:left;

    }

    .title{

        font-size:22px;

    }

}

</style>

</head>


<body>


<div class="dashboard">


    <div class="header">


        <div class="brand">

            <div class="logo">🦜</div>

            <div>

                <div class="title">
                    KALVIPARAVAI
                </div>

                <div class="subtitle">
                    Coordinator Dashboard
                </div>

            </div>

        </div>


        <div class="coordinator">

            Welcome,

            <strong id="coordinatorName">
                Coordinator
            </strong>

        </div>


    </div>


    <div class="actions">

        <button
            class="refresh-button"
            onclick="loadSessions()"
        >
            ↻ REFRESH
        </button>


        <button
            class="logout-button"
            onclick="logout()"
        >
            LOGOUT
        </button>

    </div>


    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>No</th>

                    <th>Subject Code</th>

                    <th>CourseID</th>

                    <th>Subject Name</th>

                    <th>Teacher</th>

                    <th>Meeting URL</th>

                    <th>Last Updated</th>

                    <th>Session Status</th>

                </tr>

            </thead>


            <tbody id="sessionTable">

            </tbody>

        </table>

    </div>


    <div id="message">
        Loading sessions...
    </div>


    <div class="footer">
        KPOTMS Version 3.0
    </div>


</div>


<script>

/* =====================================================
   KPOTMS V3.0
   COORDINATOR DASHBOARD

   ACCESS CONTROL
   ===================================================== */


/* =====================================================
   COORDINATOR DASHBOARD ACCESS GUARD
   =====================================================

   A Coordinator Dashboard must NOT be entered directly.

   Required session values:

       kpotmsLoggedIn = "true"
       kpotmsRole     = "COORDINATOR"

   If either condition fails:

       → CoordinatorLogin.html

   ===================================================== */

(function () {

    const loggedIn =
        sessionStorage.getItem(
            "kpotmsLoggedIn"
        );


    const role =
        sessionStorage.getItem(
            "kpotmsRole"
        );


    if (
        loggedIn !== "true" ||
        role !== "COORDINATOR"
    ) {

        window.location.replace(
            "CoordinatorLogin.html"
        );

        return;

    }

})();


/* =====================================================
   LIVE DATA SOURCE

   04_Class_Master
   through Coordinator Web App

   Columns:
   A = Subject_Code
   B = CourseID
   C = Subject_Name
   D = Teacher
   E = Meeting_URL
   F = Session_Status
   G = Last_Updated
   ===================================================== */


/* =====================================================
   COORDINATOR WEB APP
   ===================================================== */

const COORDINATOR_MANAGER_URL =
"https://script.google.com/macros/s/AKfycbyBPI1tVuHujIpBJAH5N47pmszsscx51-aqdpsTmSXYy3YeYnPc2HnuGx2SWQJlKJfX/exec";


/* =====================================================
   Coordinator name from Login
   ===================================================== */

const savedName =
    sessionStorage.getItem(
        "coordinatorName"
    );


if(savedName){

    document.getElementById(
        "coordinatorName"
    ).textContent = savedName;

}


/* =====================================================
   Current displayed sessions
   ===================================================== */

window.currentSessionRows = {};


/* =====================================================
   Load LIVE Sessions
   ===================================================== */

async function loadSessions(){

    const table =
        document.getElementById(
            "sessionTable"
        );

    const message =
        document.getElementById(
            "message"
        );


    table.innerHTML = "";

    window.currentSessionRows = {};


    message.textContent =
        "Loading live sessions...";


    try{


        const url =
            COORDINATOR_MANAGER_URL +
            "?action=getSessions&t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Unable to connect to Coordinator Server."
            );

        }


        const result =
            await response.json();


        if(!result.success){

            throw new Error(
                result.message ||
                "Unable to load sessions."
            );

        }


        const sessions =
            result.data || [];


        if(!Array.isArray(sessions)){

            throw new Error(
                "Invalid session data received."
            );

        }


        if(sessions.length === 0){

            message.textContent =
                "No sessions found.";

            return;

        }


        let count = 0;


        for(let i = 0; i < sessions.length; i++){


            const session =
                sessions[i];


            if(
                !session.Subject_Code ||
                String(
                    session.Subject_Code
                ).trim() === ""
            ){

                continue;

            }


            count++;


            const subjectCode =
                clean(
                    session.Subject_Code
                );


            const courseID =
                clean(
                    session.CourseID
                );


            const subjectName =
                clean(
                    session.Subject_Name
                );


            const teacher =
                clean(
                    session.Teacher
                );


            const meetingURL =
                clean(
                    session.Meeting_URL
                );


            const status =
                clean(
                    session.Session_Status
                ).toUpperCase();


            const lastUpdated =
                formatDateTime(
                    session.Last_Updated
                );


            window.currentSessionRows[count] = {

                subjectCode:
                    subjectCode,

                subjectName:
                    subjectName

            };


            const tr =
                document.createElement("tr");


            tr.innerHTML = `

                <td class="no">
                    ${count}
                </td>

                <td>
                    ${escapeHTML(
                        subjectCode
                    )}
                </td>

                <td class="course">
                    ${escapeHTML(
                        courseID
                    )}
                </td>

                <td class="subject">
                    ${escapeHTML(
                        subjectName
                    )}
                </td>

                <td class="teacher">
                    ${escapeHTML(
                        teacher
                    )}
                </td>

                <td class="meeting">

                    ${
                        meetingURL

                        ?

                        `<a
                            href="${escapeAttribute(
                                meetingURL
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            OPEN LINK
                        </a>`

                        :

                        "—"
                    }

                </td>

                <td class="updated">
                    ${escapeHTML(
                        lastUpdated
                    )}
                </td>

                <td class="status-cell">

                    ${createStatusHTML(
                        status,
                        count
                    )}

                </td>

            `;


            table.appendChild(tr);

        }


        if(count === 0){

            message.textContent =
                "No valid sessions found.";

            return;

        }


        message.textContent =
            count +
            " subject sessions";


    }


    catch(error){

        console.error(error);


        message.textContent =
            "Unable to load live Class Master data.";

    }

}


/* =====================================================
   Status Display
   ===================================================== */

function createStatusHTML(
    status,
    rowNumber
){

    if(status === "OPEN"){

        return `

            <span class="status status-open">
                OPEN
            </span>

            <button
                class="status-button close-button"
                onclick="changeStatus(
                    ${rowNumber},
                    'CLOSED'
                )"
            >
                CLOSE
            </button>

        `;

    }


    return `

        <span class="status status-closed">
            CLOSED
        </span>

        <button
            class="status-button open-button"
            onclick="changeStatus(
                ${rowNumber},
                'OPEN'
            )"
        >
            OPEN
        </button>

    `;

}


/* =====================================================
   OPEN / CLOSE SESSION
   ===================================================== */

async function changeStatus(
    rowNumber,
    newStatus
){

    const row =
        window.currentSessionRows[
            rowNumber
        ];


    if(!row){

        alert(
            "Session row not found."
        );

        return;

    }


    const subjectCode =
        row.subjectCode;


    const subjectName =
        row.subjectName;


    const confirmed =
        confirm(
            "Change " +
            subjectName +
            " to " +
            newStatus +
            "?"
        );


    if(!confirmed){

        return;

    }


    try{


        const buttons =
            document.querySelectorAll(
                ".status-button"
            );


        buttons.forEach(
            button => {
                button.disabled = true;
                button.style.opacity = "0.6";
            }
        );


        const url =
            COORDINATOR_MANAGER_URL +
            "?action=updateStatus" +
            "&subjectCode=" +
            encodeURIComponent(
                subjectCode
            ) +
            "&status=" +
            encodeURIComponent(
                newStatus
            ) +
            "&t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Server connection failed."
            );

        }


        const result =
            await response.json();


        if(
            !result.success
        ){

            throw new Error(
                result.message ||
                "Session update failed."
            );

        }


        await loadSessions();


        alert(
            subjectName +
            " is now " +
            newStatus +
            "."
        );


    }


    catch(error){

        console.error(error);


        alert(
            "Unable to update Session Status.\n\n" +
            error.message
        );


        await loadSessions();

    }

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout(){

    /*
     * Clear Coordinator identity
     */

    sessionStorage.removeItem(
        "coordinatorID"
    );


    sessionStorage.removeItem(
        "coordinatorName"
    );


    sessionStorage.removeItem(
        "coordinatorUserID"
    );


    /*
     * Clear V3 authentication state
     */

    sessionStorage.removeItem(
        "kpotmsLoggedIn"
    );


    sessionStorage.removeItem(
        "kpotmsRole"
    );


    /*
     * Return to Coordinator Login
     */

    window.location.replace(
        "CoordinatorLogin.html"
    );

}


/* =====================================================
   Clean value
   ===================================================== */

function clean(value){

    return String(
        value ?? ""
    ).trim();

}


/* =====================================================
   Format Last Updated
   ===================================================== */

function formatDateTime(value){

    if(
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ){

        return "";

    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return clean(value);

    }


    return date.toLocaleString();

}


/* =====================================================
   Escape HTML
   ===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   Escape URL Attribute
   ===================================================== */

function escapeAttribute(value){

    return String(
        value ?? ""
    )

    .replace(
        /"/g,
        "%22"
    )

    .replace(
        /</g,
        "%3C"
    )

    .replace(
        />/g,
        "%3E"
    );

}


/* =====================================================
   Load immediately
   ===================================================== */

loadSessions();

</script>


</body>

</html>
