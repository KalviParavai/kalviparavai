 <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Kalviparavai - Student Login</title>


<style>

* {

    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

}


body {

    background:
        linear-gradient(
            135deg,
            #0D47A1,
            #1976D2,
            #00ACC1,
            #43A047
        );

    background-size: 400% 400%;

    animation:
        bgmove 15s ease infinite;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

}


@keyframes bgmove {

    0% {

        background-position: 0% 50%;

    }

    50% {

        background-position: 100% 50%;

    }

    100% {

        background-position: 0% 50%;

    }

}


.card {

    width: 520px;

    max-width: 92%;

    background: white;

    border-radius: 20px;

    padding: 35px;

    text-align: center;

    box-shadow:
        0 15px 40px rgba(0,0,0,.30);

}


.logo {

    font-size: 65px;

}


.title {

    color: #1565C0;

    font-size: 32px;

    font-weight: bold;

    margin-top: 10px;

}


.subtitle {

    color: #666;

    margin-top: 5px;

    margin-bottom: 25px;

}


input {

    width: 100%;

    padding: 14px;

    margin: 10px 0;

    border-radius: 10px;

    border: 1px solid #cccccc;

    font-size: 16px;

}


input:focus {

    outline: none;

    border: 1px solid #1565C0;

}


button {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: none;

    border-radius: 10px;

    background: #1565C0;

    color: white;

    font-size: 18px;

    cursor: pointer;

}


button:hover {

    background: #0D47A1;

}


button:disabled {

    background: #999;

    cursor: wait;

}


#error {

    color: red;

    margin-top: 15px;

    font-weight: bold;

}


#student {

    display: none;

    margin-top: 25px;

    background: #F5F5F5;

    border-radius: 15px;

    padding: 20px;

    text-align: left;

}


#student h2 {

    color: #1565C0;

    text-align: center;

    margin-bottom: 15px;

}


.info {

    margin: 10px 0;

    font-size: 17px;

}


.continue {

    margin-top: 20px;

}


.footer {

    margin-top: 20px;

    color: #888;

    font-size: 13px;

}


.loading {

    color: #1565C0;

    margin-top: 15px;

    font-weight: bold;

}

</style>

</head>


<body>


<div class="card">


    <!-- =====================================================
         STUDENT LOGIN
         ===================================================== -->


    <div class="logo">
        🦜
    </div>


    <div class="title">
        KALVIPARAVAI
    </div>


    <div class="subtitle">
        Student Login
    </div>


    <!-- =================================================
         LOGIN INPUTS
         ================================================= -->


    <input
        id="kpsid"
        type="text"
        placeholder="Enter KPSID"
        autocomplete="username"
    >


    <input
        id="dob"
        type="text"
        placeholder="Date of Birth (DD-MM-YYYY)"
        autocomplete="off"
    >


    <button
        id="loginButton"
        onclick="login()"
    >
        LOGIN
    </button>


    <div id="loading"></div>


    <div id="error"></div>


    <!-- =================================================
         STUDENT INFORMATION

         CourseID is deliberately NOT displayed.
         ================================================= -->


    <div id="student">


        <h2>
            Welcome
        </h2>


        <div class="info">

            <b>Student :</b>

            <span id="studentName"></span>

        </div>


        <div class="info">

            <b>KPSID :</b>

            <span id="studentID"></span>

        </div>


        <div class="info">

            <b>Course :</b>

            <span id="studentCourse"></span>

        </div>


        <button
            class="continue"
            onclick="openStudentSessions()"
        >
            CONTINUE
        </button>


    </div>


    <div class="footer">

        KPOTMS Version 3.0

    </div>


</div>


<script>


/* ==========================================================
   KPOTMS V3.0
   STUDENT LOGIN ENTRY CONTROL

   ----------------------------------------------------------
   Normal entry:

       index.html
            ↓
       StudentsLogin.html

   Direct browser entry:

       StudentsLogin.html
            ↓
       index.html

   No access-denied screen is displayed.
   ========================================================== */


(function checkStudentLoginEntry() {


    const referrer =
        document.referrer || "";


    let allowed = false;


    try {


        if (referrer) {


            const referrerURL =
                new URL(
                    referrer,
                    window.location.href
                );


            const path =
                referrerURL.pathname
                    .toLowerCase();


            /*
             * Allow entry from index.html.
             *
             * Examples:
             *
             * /index.html
             *
             * /kalviparavai/index.html
             *
             * /some-folder/index.html
             *
             */

            if (
                path.endsWith(
                    "/index.html"
                )
            ) {

                allowed = true;

            }


            /*
             * Also allow the site root.
             */

            if (
                path.endsWith("/")
            ) {

                allowed = true;

            }

        }

    }


    catch (error) {


        console.error(
            "Student Login entry check failed:",
            error
        );


        allowed = false;

    }


    /*
     * ------------------------------------------------------
     * DIRECT ACCESS BLOCK
     * ------------------------------------------------------
     *
     * If StudentsLogin.html was opened directly,
     * immediately return to index.html.
     *
     * No message is displayed.
     */

    if (!allowed) {


        window.location.replace(
            "index.html"
        );


    }


})();


/* ==========================================================
   DATA SOURCE
   ========================================================== */


const csvURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSJxSOEW0y5LERF7KJQKN-ivKxL9D_1tbX9S09kAvn_jTw7719AZInIgGYwd3ent-IX4ky11N2TrS4s/pub?gid=55364272&single=true&output=csv";


/* ==========================================================
   CSV PARSER
   ========================================================== */


function parseCSVLine(line) {


    const result = [];

    let current = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < line.length;
        i++
    ) {


        const char =
            line[i];


        if (char === '"') {


            if (
                insideQuotes &&
                line[i + 1] === '"'
            ) {


                current += '"';

                i++;


            }

            else {


                insideQuotes =
                    !insideQuotes;


            }

        }


        else if (
            char === "," &&
            !insideQuotes
        ) {


            result.push(
                current
            );

            current = "";


        }


        else {


            current += char;


        }

    }


    result.push(
        current
    );


    return result.map(
        function(value) {


            return value
                .trim()
                .replace(
                    /^"|"$/g,
                    ""
                )
                .trim();


        }
    );

}


/* ==========================================================
   NORMALIZE DATE
   ========================================================== */


function normalizeDOB(value) {


    return String(
        value || ""
    )
    .trim()
    .replace(
        /[./]/g,
        "-"
    );


}


/* ==========================================================
   LOGIN
   ========================================================== */


async function login() {


    const errorElement =
        document.getElementById(
            "error"
        );


    const loadingElement =
        document.getElementById(
            "loading"
        );


    const studentElement =
        document.getElementById(
            "student"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    errorElement.innerHTML =
        "";


    loadingElement.innerHTML =
        "";


    studentElement.style.display =
        "none";


    const kpsid =
        document
            .getElementById(
                "kpsid"
            )
            .value
            .trim()
            .toUpperCase();


    const dob =
        document
            .getElementById(
                "dob"
            )
            .value
            .trim();


    if (
        kpsid === "" ||
        dob === ""
    ) {


        errorElement.innerHTML =
            "Please enter KPSID and Date of Birth.";


        return;


    }


    loginButton.disabled =
        true;


    loadingElement.innerHTML =
        "Checking student details...";


    try {


        /* --------------------------------------------------
           Read 01_Students_Login LIVE
           -------------------------------------------------- */


        const response =
            await fetch(
                csvURL +
                "&t=" +
                Date.now()
            );


        if (!response.ok) {


            throw new Error(
                "Student database could not be loaded."
            );


        }


        const csv =
            await response.text();


        const rows =
            csv.split(
                /\r?\n/
            );


        const enteredDOB =
            normalizeDOB(
                dob
            );


        let studentFound =
            false;


        /* --------------------------------------------------
           Search student
           -------------------------------------------------- */


        for (
            let i = 1;
            i < rows.length;
            i++
        ) {


            if (
                rows[i].trim() === ""
            ) {


                continue;


            }


            const cols =
                parseCSVLine(
                    rows[i]
                );


            /*
             * A = KPSID
             * B = Date_of_Birth
             * C = Student_Name
             * D = Course
             * E = CourseID
             */


            const id =
                String(
                    cols[0] || ""
                )
                .trim()
                .toUpperCase();


            const birth =
                normalizeDOB(
                    cols[1] || ""
                );


            const name =
                String(
                    cols[2] || ""
                )
                .trim();


            const course =
                String(
                    cols[3] || ""
                )
                .trim();


            const courseID =
                String(
                    cols[4] || ""
                )
                .trim();


            /* ------------------------------------------------
               MATCH KPSID + DOB
               ------------------------------------------------ */


            if (
                id === kpsid &&
                birth === enteredDOB
            ) {


                /*
                 * CourseID MUST exist.
                 */


                if (
                    courseID === ""
                ) {


                    throw new Error(
                        "Student CourseID is missing in 01_Students_Login."
                    );


                }


                /*
                 * Clear previous student session data.
                 */


                sessionStorage.removeItem(
                    "kpotms_student_name"
                );


                sessionStorage.removeItem(
                    "kpotms_student_id"
                );


                sessionStorage.removeItem(
                    "kpotms_student_course"
                );


                sessionStorage.removeItem(
                    "kpotms_student_course_id"
                );


                /*
                 * Store student information.
                 */


                sessionStorage.setItem(
                    "kpotms_student_name",
                    name
                );


                sessionStorage.setItem(
                    "kpotms_student_id",
                    id
                );


                sessionStorage.setItem(
                    "kpotms_student_course",
                    course
                );


                sessionStorage.setItem(
                    "kpotms_student_course_id",
                    courseID
                );


                /*
                 * Compatibility values.
                 */


                sessionStorage.setItem(
                    "studentName",
                    name
                );


                sessionStorage.setItem(
                    "studentID",
                    id
                );


                sessionStorage.setItem(
                    "studentCourse",
                    course
                );


                sessionStorage.setItem(
                    "courseID",
                    courseID
                );


                /*
                 * Display student information.
                 */


                document
                    .getElementById(
                        "studentName"
                    )
                    .textContent =
                        name;


                document
                    .getElementById(
                        "studentID"
                    )
                    .textContent =
                        id;


                document
                    .getElementById(
                        "studentCourse"
                    )
                    .textContent =
                        course;


                loadingElement.innerHTML =
                    "";


                studentElement.style.display =
                    "block";


                studentFound =
                    true;


                return;


            }


        }


        /* --------------------------------------------------
           STUDENT NOT FOUND
           -------------------------------------------------- */


        if (!studentFound) {


            errorElement.innerHTML =
                "Invalid KPSID or Date of Birth.";


        }


    }


    catch (error) {


        console.error(
            "Student Login Error:",
            error
        );


        errorElement.innerHTML =
            error.message ||
            "Unable to connect to Student Database.";


    }


    finally {


        loginButton.disabled =
            false;


        loadingElement.innerHTML =
            "";


    }


}


/* ==========================================================
   OPEN STUDENT SESSIONS
   ========================================================== */


function openStudentSessions() {


    const courseID =
        sessionStorage.getItem(
            "kpotms_student_course_id"
        );


    if (!courseID) {


        document
            .getElementById(
                "error"
            )
            .innerHTML =
                "Student CourseID is not available.";


        return;


    }


    window.location.href =
        "StudentSessions.html";


}


/* ==========================================================
   ENTER KEY SUPPORT
   ========================================================== */


document
    .getElementById(
        "kpsid"
    )
    .addEventListener(
        "keydown",
        function(event) {


            if (
                event.key === "Enter"
            ) {


                login();


            }


        }
    );


document
    .getElementById(
        "dob"
    )
    .addEventListener(
        "keydown",
        function(event) {


            if (
                event.key === "Enter"
            ) {


                login();


            }


        }
    );


</script>


</body>

</html>
