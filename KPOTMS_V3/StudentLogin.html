<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kalviparavai - Student Login</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Segoe UI, Arial, sans-serif;
}

body {

    background: linear-gradient(
        135deg,
        #0D47A1,
        #1976D2,
        #00ACC1,
        #43A047
    );

    background-size: 400% 400%;

    animation: bgmove 15s ease infinite;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;
}

@keyframes bgmove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}

.card {

    width: 520px;

    max-width: 92%;

    background: white;

    border-radius: 20px;

    padding: 35px;

    text-align: center;

    box-shadow: 0 15px 40px rgba(0,0,0,.30);
}

.logo {

    font-size: 65px;
}

.title {

    color: #1565C0;

    font-size: 32px;

    font-weight: bold;

    margin-top: 10px;
}

.subtitle {

    color: #666;

    margin-top: 5px;

    margin-bottom: 25px;
}

input {

    width: 100%;

    padding: 14px;

    margin: 10px 0;

    border-radius: 10px;

    border: 1px solid #cccccc;

    font-size: 16px;
}

input:focus {

    outline: none;

    border: 1px solid #1565C0;
}

button {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: none;

    border-radius: 10px;

    background: #1565C0;

    color: white;

    font-size: 18px;

    cursor: pointer;
}

button:hover {

    background: #0D47A1;
}

#error {

    color: red;

    margin-top: 15px;

    font-weight: bold;
}

#student {

    display: none;

    margin-top: 25px;

    background: #F5F5F5;

    border-radius: 15px;

    padding: 20px;

    text-align: left;
}

#student h2 {

    color: #1565C0;

    text-align: center;

    margin-bottom: 15px;
}

.info {

    margin: 10px 0;

    font-size: 17px;
}

.join {

    margin-top: 20px;
}

.footer {

    margin-top: 20px;

    color: #888;

    font-size: 13px;
}

</style>

</head>


<body>


<div class="card">


    <div class="logo">
        🦜
    </div>


    <div class="title">
        KALVIPARAVAI
    </div>


    <div class="subtitle">
        Student Login
    </div>


    <input
        id="kpsid"
        type="text"
        placeholder="Enter KPSID"
        autocomplete="username"
    >


    <input
        id="dob"
        type="password"
        placeholder="Date of Birth"
        autocomplete="current-password"
    >


    <button onclick="login()">
        LOGIN
    </button>


    <div id="error"></div>


    <div id="student">


        <h2>
            Welcome
        </h2>


        <div class="info">

            <b>Student :</b>

            <span id="studentName"></span>

        </div>


        <div class="info">

            <b>KPSID :</b>

            <span id="studentID"></span>

        </div>


        <div class="info">

            <b>Course :</b>

            <span id="studentCourse"></span>

        </div>


        <button
            class="join"
            onclick="goToSessions()"
        >
            VIEW SESSIONS
        </button>


    </div>


    <div class="footer">
        KPOTMS Version 3.0
    </div>


</div>


<script>

/* =====================================================
   KPOTMS V3.0
   Student Login

   Google Sheet:
   01_Students_Login

   Columns:

   A = KPSID
   B = Date_of_Birth
   C = Student_Name
   D = Course
   E = CourseID

   CourseID is INTERNAL ONLY.
   It is NOT displayed to students.
   ===================================================== */


/* =====================================================
   STUDENT LOGIN CSV
   ===================================================== */

const csvURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSJxSOEW0y5LERF7KJQKN-ivKxL9D_1tbX9S09kAvn_jTw7719AZInIgGYwd3ent-IX4ky11N2TrS4s/pub?gid=55364272&single=true&output=csv";


/* =====================================================
   LOGIN
   ===================================================== */

async function login() {


    document.getElementById(
        "error"
    ).innerHTML = "";


    document.getElementById(
        "student"
    ).style.display = "none";


    const kpsid =
        document.getElementById(
            "kpsid"
        )
        .value
        .trim()
        .toUpperCase();


    const dob =
        document.getElementById(
            "dob"
        )
        .value
        .trim();


    if (
        kpsid === "" ||
        dob === ""
    ) {

        document.getElementById(
            "error"
        ).innerHTML =
            "Please enter KPSID and Date of Birth.";

        return;

    }


    try {


        /*
         * Read latest published login data.
         */

        const response =
            await fetch(
                csvURL +
                "&t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to connect to Student Database."
            );

        }


        const csv =
            await response.text();


        const rows =
            csv.split(/\r?\n/);


        for (
            let i = 1;
            i < rows.length;
            i++
        ) {


            if (
                rows[i].trim() === ""
            ) {

                continue;

            }


            /*
             * 01_Students_Login contains
             * only simple login fields.
             */

            const cols =
                rows[i].split(",");


            const id =
                (cols[0] || "")
                .replace(/"/g, "")
                .trim()
                .toUpperCase();


            const birth =
                (cols[1] || "")
                .replace(/"/g, "")
                .trim();


            const name =
                (cols[2] || "")
                .replace(/"/g, "")
                .trim();


            const course =
                (cols[3] || "")
                .replace(/"/g, "")
                .trim();


            /*
             * CourseID is read internally.
             * It is NOT displayed.
             */

            const courseID =
                (cols[4] || "")
                .replace(/"/g, "")
                .trim();


            /*
             * Authenticate student.
             */

            if (
                id === kpsid &&
                birth === dob
            ) {


                /*
                 * Store student identity.
                 */

                sessionStorage.setItem(
                    "studentKPSID",
                    id
                );


                sessionStorage.setItem(
                    "studentName",
                    name
                );


                sessionStorage.setItem(
                    "studentCourse",
                    course
                );


                /*
                 * CourseID is an internal
                 * routing value only.
                 */

                sessionStorage.setItem(
                    "studentCourseID",
                    courseID
                );


                /*
                 * Display only student-facing
                 * information.
                 */

                document.getElementById(
                    "studentName"
                ).textContent =
                    name;


                document.getElementById(
                    "studentID"
                ).textContent =
                    id;


                document.getElementById(
                    "studentCourse"
                ).textContent =
                    course;


                document.getElementById(
                    "student"
                ).style.display =
                    "block";


                return;

            }

        }


        document.getElementById(
            "error"
        ).innerHTML =
            "Invalid KPSID or Date of Birth.";


    }

    catch (error) {

        console.error(error);


        document.getElementById(
            "error"
        ).innerHTML =
            "Unable to connect to Student Database.";

    }

}


/* =====================================================
   GO TO STUDENT SESSIONS
   ===================================================== */

function goToSessions() {


    const courseID =
        sessionStorage.getItem(
            "studentCourseID"
        );


    if (!courseID) {

        document.getElementById(
            "error"
        ).innerHTML =
            "Course information is not available.";

        return;

    }


    window.location.href =
        "StudentSessions.html";

}

</script>


</body>

</html>
