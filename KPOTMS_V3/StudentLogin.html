<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalviparavai - Student Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1E88E5,#00BCD4,#43A047,#8E24AA);
    background-size:400% 400%;
    animation:bgmove 12s ease infinite;
}

@keyframes bgmove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.login-box{
    width:380px;
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
    text-align:center;
}

.logo{
    font-size:60px;
}

h1{
    color:#1565C0;
    margin-top:10px;
}

h3{
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #cccccc;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:#1565C0;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0D47A1;
}

#error{
    color:red;
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">🦜</div>

<h1>KALVIPARAVAI</h1>

<h3>Student Login</h3>

<input
type="text"
id="kpsid"
placeholder="Enter KPSID">

<input
type="password"
id="dob"
placeholder="Date of Birth (DD-MM-YYYY)">

<button onclick="login()">
LOGIN
</button>

<div id="error"></div>

</div>

<script>

function login(){

let id=document.getElementById("kpsid").value.trim();

let dob=document.getElementById("dob").value.trim();

if(id=="" || dob==""){

document.getElementById("error").innerHTML=
"Please enter KPSID and Date of Birth.";

return;

}

/*

Google Sheet verification
will be added in the next step.

*/

alert("Stage 1 Login Screen Ready");

}

</script>

</body>
</html>
