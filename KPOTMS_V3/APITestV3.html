<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>KPOTMS V3 - API Bridge Test</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      color: #0b2a57;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #f3f3f3;
      white-space: pre-wrap;
    }

  </style>

</head>


<body>

  <h1>KPOTMS V3 — API Bridge Test</h1>

  <p>
    Testing:
    Browser → Apps Script Web App → WebAPI.gs
    → Auth.gs → Coordinator Role
  </p>

  <button onclick="testCoordinator()">
    TEST COORDINATOR LOGIN
  </button>

  <div id="status">
    Ready for test...
  </div>


  <script>

    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbwC2PHcaVlF0X0vB8mOVB1Vek_QC7mnI4m_4qXKx9iosFuQRQWdUVtSzGozQ8RUw0LO/exec";


    async function testCoordinator() {

      const status =
        document.getElementById("status");


      status.textContent =
        "Sending request...";


      const request = {

        action:
          "loginCoordinator",

        userID:
          "admin",

        password:
          "admin@123"

      };


      try {

        const response =
          await fetch(
            WEB_APP_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify(request)

            }
          );


        const text =
          await response.text();


        status.textContent =
          "HTTP Response:\n\n" +
          text;


        console.log(
          "KPOTMS API Response:",
          text
        );


      }

      catch (error) {

        console.error(error);


        status.textContent =
          "BRIDGE ERROR:\n\n" +
          error.toString();

      }

    }

  </script>

</body>

</html>
