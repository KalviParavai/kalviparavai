<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Kalviparavai - Student Sessions</title>


<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}


/* =========================================================
   PAGE
   ========================================================= */

body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #0D47A1,
            #1976D2,
            #00ACC1,
            #43A047
        );

    background-size: 400% 400%;

    animation: bgmove 15s ease infinite;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    padding: 20px;

}


@keyframes bgmove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* =========================================================
   MAIN CARD
   ========================================================= */

.card {

    width: 100%;

    max-width: 1100px;

    background: white;

    border-radius: 20px;

    padding: 22px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.30);

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    margin-bottom: 15px;

}


.brand {

    display: flex;

    align-items: center;

    gap: 12px;

}


.logo {

    font-size: 48px;

    line-height: 1;

}


.title {

    color: #1565C0;

    font-size: 27px;

    font-weight: bold;

}


.subtitle {

    color: #666;

    font-size: 14px;

    margin-top: 2px;

}


.welcome {

    text-align: right;

    color: #555;

    font-size: 14px;

}


.welcome strong {

    color: #1565C0;

}


/* =========================================================
   BUTTON BAR
   ========================================================= */

.toolbar {

    display: flex;

    gap: 10px;

    margin-bottom: 16px;

}


.toolbar button {

    width: auto;

    padding: 10px 18px;

    margin: 0;

    border: none;

    border-radius: 8px;

    font-size: 14px;

    cursor: pointer;

}


.refresh {

    background: #1976D2;

    color: white;

}


.refresh:hover {

    background: #0D47A1;

}


.logout {

    background: #eeeeee;

    color: #333;

}


.logout:hover {

    background: #dddddd;

}


/* =========================================================
   MESSAGE
   ========================================================= */

#message {

    text-align: center;

    padding: 20px;

    color: #666;

    font-size: 15px;

}


/* =========================================================
   ERROR
   ========================================================= */

#error {

    display: none;

    text-align: center;

    padding: 15px;

    color: #c62828;

    background: #ffebee;

    border-radius: 10px;

    margin-bottom: 15px;

    font-weight: bold;

}


/* =========================================================
   SESSION GRID
   ========================================================= */

#sessions {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 16px;

}


/* =========================================================
   SESSION CARD
   ========================================================= */

.session {

    background: #f7f9fc;

    border: 1px solid #d9dee5;

    border-radius: 14px;

    padding: 16px;

    min-height: 145px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    box-shadow:
        0 5px 12px rgba(0,0,0,.08);

}


.session:hover {

    box-shadow:
        0 8px 18px rgba(0,0,0,.12);

}


/* =========================================================
   SUBJECT CODE
   ========================================================= */

.subject-code {

    color: #777;

    font-size: 12px;

    margin-bottom: 4px;

}


/* =========================================================
   SUBJECT NAME
   ========================================================= */

.subject-name {

    color: #1565C0;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 10px;

}


/* =========================================================
   TEACHER
   ========================================================= */

.teacher {

    color: #555;

    font-size: 13px;

}


/* =========================================================
   SESSION FOOTER
   ========================================================= */

.session-footer {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-top: 18px;

}


/* =========================================================
   STATUS
   ========================================================= */

.status {

    display: inline-block;

    padding: 6px 12px;

    border-radius: 20px;

    font-size: 11px;

    font-weight: bold;

}


.status.open {

    background: #d8f5df;

    color: #087f23;

}


.status.closed {

    background: #ffdede;

    color: #c62828;

}


/* =========================================================
   JOIN BUTTON
   ========================================================= */

.join-button {

    border: none;

    border-radius: 7px;

    padding: 8px 15px;

    background: #138a3d;

    color: white;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;

}


.join-button:hover {

    background: #0b6d2e;

}


.join-button:active {

    transform: scale(.98);

}


/* =========================================================
   NOT AVAILABLE
   ========================================================= */

.not-available {

    color: #888;

    font-size: 12px;

    text-align: right;

}


/* =========================================================
   SUMMARY
   ========================================================= */

#summary {

    text-align: center;

    color: #555;

    font-size: 14px;

    margin-top: 22px;

}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

    text-align: center;

    color: #888;

    font-size: 12px;

    margin-top: 28px;

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 850px) {

    #sessions {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

    }

}


@media (max-width: 600px) {

    body {

        padding: 10px;

    }


    .card {

        padding: 15px;

        border-radius: 15px;

    }


    .header {

        flex-direction: column;

        gap: 12px;

    }


    .welcome {

        text-align: left;

    }


    #sessions {

        grid-template-columns: 1fr;

    }


    .title {

        font-size: 23px;

    }


    .logo {

        font-size: 40px;

    }

}

</style>

</head>

<div class="card">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="header">

        <div class="brand">

            <div class="logo">
                🦜
            </div>

            <div>

                <div class="title">
                    KALVIPARAVAI
                </div>

                <div class="subtitle">
                    Student Sessions
                </div>

            </div>

        </div>


        <div class="welcome">

            Welcome,
            <strong id="studentName">
                Student
            </strong>

            <br>

            <span id="studentCourse">
                Loading...
            </span>

        </div>

    </div>


    <!-- =====================================================
         TOOLBAR
         ===================================================== -->

    <div class="toolbar">

        <button
            class="refresh"
            onclick="loadSessions()"
        >
            ↻ REFRESH
        </button>


        <button
            class="logout"
            onclick="logout()"
        >
            LOGOUT
        </button>

    </div>


    <!-- =====================================================
         ERROR
         ===================================================== -->

    <div id="error"></div>


    <!-- =====================================================
         LOADING MESSAGE
         ===================================================== -->

    <div id="message">
        Loading your sessions...
    </div>


    <!-- =====================================================
         SESSION CARDS
         ===================================================== -->

    <div id="sessions"></div>


    <!-- =====================================================
         SUMMARY
         ===================================================== -->

    <div id="summary"></div>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <div class="footer">

        KPOTMS Version 3.0

    </div>


</div>


<script>

/* =========================================================
   KPOTMS V3.0
   Student Sessions

   DATA FLOW

   01_Students_Login
          |
          | KPSID + DOB
          v
      Student Login
          |
          | CourseID
          v
      Course Master
          |
          | Subject_Code1
          | Subject_Code2
          | Subject_Code3
          | Subject_Code4
          | Subject_Code5
          v
      04_Class_Master
          |
          | Subject Name
          | Teacher
          | Meeting URL
          | OPEN / CLOSED
          v
      Student Sessions


   IMPORTANT

   CourseID is an INTERNAL KEY.

   CourseID is NOT displayed to the student.


   EXAMPLE

   CourseID 6
       |
       +-- Subject_Code1 = 12
       +-- Subject_Code2 = 13
       +-- Subject_Code3 = 14
       +-- Subject_Code4 = 15
       +-- Subject_Code5 = 17
   ========================================================= */


/* =========================================================
   GOOGLE SHEET CSV URLS
   ========================================================= */


/* ---------------------------------------------------------
   Course Master
   --------------------------------------------------------- */

const COURSE_MASTER_CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSJxSOEW0y5LERF7KJQKN-ivKxL9D_1tbX9S09kAvn_jTw7719AZInIgGYwd3ent-IX4ky11N2TrS4s/pub?gid=630763762&single=true&output=csv";


/* ---------------------------------------------------------
   04_Class_Master
   --------------------------------------------------------- */

const CLASS_MASTER_CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSJxSOEW0y5LERF7KJQKN-ivKxL9D_1tbX9S09kAvn_jTw7719AZInIgGYwd3ent-IX4ky11N2TrS4s/pub?gid=956481198&single=true&output=csv";


/* =========================================================
   STORAGE KEYS
   ========================================================= */

const STORAGE_NAME =
    "kpotms_student_name";

const STORAGE_ID =
    "kpotms_student_id";

const STORAGE_COURSE =
    "kpotms_student_course";

const STORAGE_COURSE_ID =
    "kpotms_student_course_id";


/* =========================================================
   CSV PARSER
   =========================================================

   Handles quoted CSV fields and commas inside quotes.
   ========================================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        const next =
            text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }


        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }


        if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(value);

            value = "";


            if (
                row.some(
                    cell =>
                    String(cell).trim() !== ""
                )
            ) {

                rows.push(row);

            }


            row = [];

            continue;

        }


        value += char;

    }


    if (
        value !== "" ||
        row.length > 0
    ) {

        row.push(value);


        if (
            row.some(
                cell =>
                String(cell).trim() !== ""
            )
        ) {

            rows.push(row);

        }

    }


    return rows;

}


/* =========================================================
   CLEAN VALUE
   ========================================================= */

function clean(value) {

    return String(value ?? "")
        .replace(/^\uFEFF/, "")
        .trim();

}


/* =========================================================
   FIND HEADER
   ========================================================= */

function findHeader(headers, names) {

    for (
        const name of names
    ) {

        const index =
            headers.findIndex(
                h =>
                clean(h).toLowerCase() ===
                name.toLowerCase()
            );


        if (index !== -1) {

            return index;

        }

    }


    return -1;

}


/* =========================================================
   GET STUDENT INFORMATION
   ========================================================= */

function getStudentInformation() {

    const name =
        sessionStorage.getItem(
            STORAGE_NAME
        ) ||
        sessionStorage.getItem(
            "studentName"
        );


    const studentID =
        sessionStorage.getItem(
            STORAGE_ID
        ) ||
        sessionStorage.getItem(
            "studentID"
        );


    const course =
        sessionStorage.getItem(
            STORAGE_COURSE
        ) ||
        sessionStorage.getItem(
            "studentCourse"
        );


    const courseID =
        sessionStorage.getItem(
            STORAGE_COURSE_ID
        ) ||
        sessionStorage.getItem(
            "courseID"
        );


    return {

        name:
            clean(name),

        studentID:
            clean(studentID),

        course:
            clean(course),

        courseID:
            clean(courseID)

    };

}


/* =========================================================
   LOAD SESSIONS
   ========================================================= */

async function loadSessions() {

    const message =
        document.getElementById(
            "message"
        );

    const error =
        document.getElementById(
            "error"
        );

    const sessionsContainer =
        document.getElementById(
            "sessions"
        );

    const summary =
        document.getElementById(
            "summary"
        );


    message.style.display =
        "block";

    message.innerHTML =
        "Loading your sessions...";


    error.style.display =
        "none";

    error.innerHTML =
        "";


    sessionsContainer.innerHTML =
        "";

    summary.innerHTML =
        "";


    try {


        /* =================================================
           STEP 1
           GET LOGGED-IN STUDENT
           ================================================= */

        const student =
            getStudentInformation();


        if (!student.courseID) {

            throw new Error(
                "Student CourseID is not available."
            );

        }


        /* =================================================
           DISPLAY STUDENT INFORMATION

           CourseID deliberately NOT displayed.
           ================================================= */

        document.getElementById(
            "studentName"
        ).textContent =
            student.name ||
            "Student";


        document.getElementById(
            "studentCourse"
        ).textContent =
            student.course ||
            "";


        /* =================================================
           STEP 2
           READ COURSE MASTER
           ================================================= */

        const courseResponse =
            await fetch(
                COURSE_MASTER_CSV_URL +
                "&t=" +
                Date.now()
            );


        if (!courseResponse.ok) {

            throw new Error(
                "Unable to read Course Master."
            );

        }


        const courseCSV =
            await courseResponse.text();


        if (!courseCSV.trim()) {

            throw new Error(
                "Course Master returned empty data."
            );

        }


        const courseRows =
            parseCSV(courseCSV);


        if (
            courseRows.length < 2
        ) {

            throw new Error(
                "Course Master contains no records."
            );

        }


        /* =================================================
           STEP 3
           READ COURSE MASTER HEADERS
           ================================================= */

        const courseHeaders =
            courseRows[0].map(
                h => clean(h)
            );


        const courseIDColumn =
            findHeader(
                courseHeaders,
                [
                    "CourseID",
                    "Course_ID",
                    "Course ID"
                ]
            );


        /*
           IMPORTANT:
           Explicitly identify the five
           subject-code columns.
        */

        const subjectCode1Column =
            findHeader(
                courseHeaders,
                [
                    "Subject_Code1"
                ]
            );


        const subjectCode2Column =
            findHeader(
                courseHeaders,
                [
                    "Subject_Code2"
                ]
            );


        const subjectCode3Column =
            findHeader(
                courseHeaders,
                [
                    "Subject_Code3"
                ]
            );


        const subjectCode4Column =
            findHeader(
                courseHeaders,
                [
                    "Subject_Code4"
                ]
            );


        const subjectCode5Column =
            findHeader(
                courseHeaders,
                [
                    "Subject_Code5"
                ]
            );


        if (
            courseIDColumn === -1
        ) {

            throw new Error(
                "CourseID column not found in Course Master."
            );

        }


        if (
            subjectCode1Column === -1 ||
            subjectCode2Column === -1 ||
            subjectCode3Column === -1 ||
            subjectCode4Column === -1 ||
            subjectCode5Column === -1
        ) {

            throw new Error(
                "One or more Subject_Code1 to Subject_Code5 columns are missing in Course Master."
            );

        }


        /* =================================================
           STEP 4
           FIND EXACT COURSE RECORD
           ================================================= */

        let courseRecord =
            null;


        for (
            let i = 1;
            i < courseRows.length;
            i++
        ) {

            const row =
                courseRows[i];


            if (!row) {

                continue;

            }


            const rowCourseID =
                clean(
                    row[
                        courseIDColumn
                    ]
                );


            if (
                rowCourseID ===
                student.courseID
            ) {

                courseRecord =
                    row;

                break;

            }

        }


        if (!courseRecord) {

            throw new Error(
                "CourseID " +
                student.courseID +
                " was not found in Course Master."
            );

        }


        /* =================================================
           STEP 5
           EXPLICITLY COLLECT FIVE SUBJECT CODES
           ================================================= */

        const eligibleSubjectCodes = [

            clean(
                courseRecord[
                    subjectCode1Column
                ]
            ),

            clean(
                courseRecord[
                    subjectCode2Column
                ]
            ),

            clean(
                courseRecord[
                    subjectCode3Column
                ]
            ),

            clean(
                courseRecord[
                    subjectCode4Column
                ]
            ),

            clean(
                courseRecord[
                    subjectCode5Column
                ]
            )

        ];


        /*
           Remove empty / zero entries.

           Preserve the original order.
        */

        const filteredSubjectCodes =
            eligibleSubjectCodes.filter(
                code =>
                    code !== "" &&
                    code !== "0"
            );


        /*
           Remove duplicates if any.
        */

        const uniqueSubjectCodes =
            [
                ...new Set(
                    filteredSubjectCodes
                )
            ];


        if (
            uniqueSubjectCodes.length === 0
        ) {

            throw new Error(
                "No eligible Subject Codes found for CourseID " +
                student.courseID +
                "."
            );

        }


        /*
           DEBUG INFORMATION

           This will appear only in the
           browser console.

           It does NOT expose CourseID
           on the student screen.
        */

        console.log(
            "KPOTMS CourseID:",
            student.courseID
        );

        console.log(
            "KPOTMS Eligible Subject Codes:",
            uniqueSubjectCodes
        );


        /* =================================================
           STEP 6
           READ 04_CLASS_MASTER LIVE
           ================================================= */

        const classResponse =
            await fetch(
                CLASS_MASTER_CSV_URL +
                "&t=" +
                Date.now()
            );


        if (!classResponse.ok) {

            throw new Error(
                "Unable to read 04_Class_Master."
            );

        }


        const classCSV =
            await classResponse.text();


        if (!classCSV.trim()) {

            throw new Error(
                "04_Class_Master returned empty data."
            );

        }


        const classRows =
            parseCSV(classCSV);


        if (
            classRows.length < 2
        ) {

            throw new Error(
                "04_Class_Master contains no records."
            );

        }


        /* =================================================
           STEP 7
           CLASS MASTER HEADERS
           ================================================= */

        const classHeaders =
            classRows[0].map(
                h => clean(h)
            );


        const subjectCodeColumn =
            findHeader(
                classHeaders,
                [
                    "Subject_Code",
                    "Subject Code"
                ]
            );


        const subjectNameColumn =
            findHeader(
                classHeaders,
                [
                    "Subject_Name",
                    "Subject Name"
                ]
            );


        const teacherColumn =
            findHeader(
                classHeaders,
                [
                    "Teacher"
                ]
            );


        const meetingURLColumn =
            findHeader(
                classHeaders,
                [
                    "Meeting_URL",
                    "Meeting URL"
                ]
            );


        const statusColumn =
            findHeader(
                classHeaders,
                [
                    "Session_Status",
                    "Session Status"
                ]
            );


        if (
            subjectCodeColumn === -1 ||
            subjectNameColumn === -1 ||
            teacherColumn === -1 ||
            meetingURLColumn === -1 ||
            statusColumn === -1
        ) {

            throw new Error(
                "Required columns are missing in 04_Class_Master."
            );

        }


        /* =================================================
           STEP 8
           BUILD CLASS MASTER LOOKUP
           ================================================= */

        const classMaster =
            {};


        for (
            let i = 1;
            i < classRows.length;
            i++
        ) {

            const row =
                classRows[i];


            if (!row) {

                continue;

            }


            const subjectCode =
                clean(
                    row[
                        subjectCodeColumn
                    ]
                );


            if (!subjectCode) {

                continue;

            }


            classMaster[
                subjectCode
            ] = {

                subjectCode:
                    subjectCode,

                subjectName:
                    clean(
                        row[
                            subjectNameColumn
                        ]
                    ),

                teacher:
                    clean(
                        row[
                            teacherColumn
                        ]
                    ),

                meetingURL:
                    clean(
                        row[
                            meetingURLColumn
                        ]
                    ),

                sessionStatus:
                    clean(
                        row[
                            statusColumn
                        ]
                    ).toUpperCase()

            };

        }


        /* =================================================
           STEP 9
           MATCH ELIGIBLE SUBJECT CODES
           AGAINST 04_CLASS_MASTER
           ================================================= */

        const sessions =
            [];


        for (
            const subjectCode
            of uniqueSubjectCodes
        ) {

            const session =
                classMaster[
                    subjectCode
                ];


            if (session) {

                sessions.push(
                    session
                );

            }

        }


        /* =================================================
           STEP 10
           DISPLAY
           ================================================= */

        renderSessions(
            sessions
        );

    }


    catch (err) {

        console.error(
            "KPOTMS Student Sessions Error:",
            err
        );


        message.style.display =
            "none";


        error.style.display =
            "block";


        error.textContent =
            err.message ||
            "Unable to load Student Sessions.";

    }

}


/* =========================================================
   RENDER SESSIONS
   ========================================================= */

function renderSessions(
    sessions
) {

    const message =
        document.getElementById(
            "message"
        );

    const container =
        document.getElementById(
            "sessions"
        );

    const summary =
        document.getElementById(
            "summary"
        );


    container.innerHTML =
        "";


    message.style.display =
        "none";


    if (
        !sessions ||
        sessions.length === 0
    ) {

        message.style.display =
            "block";

        message.innerHTML =
            "No subjects are available for your course.";

        return;

    }


    let openCount =
        0;


    sessions.forEach(
        session => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "session";


            const status =
                session.sessionStatus ===
                "OPEN"
                    ? "OPEN"
                    : "CLOSED";


            if (
                status === "OPEN"
            ) {

                openCount++;

            }


            const statusClass =
                status === "OPEN"
                    ? "open"
                    : "closed";


            let actionHTML =
                "";


            /* ---------------------------------------------
               OPEN SESSION
               --------------------------------------------- */

            if (
                status === "OPEN"
            ) {

                actionHTML = `
                    <button
                        class="join-button"
                        onclick='joinSession(${JSON.stringify(
                            session.meetingURL
                        )})'
                    >
                        JOIN SESSION
                    </button>
                `;

            }


            /* ---------------------------------------------
               CLOSED SESSION
               --------------------------------------------- */

            else {

                actionHTML = `
                    <span class="not-available">
                        Session not available
                    </span>
                `;

            }


            card.innerHTML = `

                <div>

                    <div class="subject-code">
                        Subject ${escapeHTML(
                            session.subjectCode
                        )}
                    </div>


                    <div class="subject-name">
                        ${escapeHTML(
                            session.subjectName
                        )}
                    </div>


                    <div class="teacher">
                        <b>Teacher:</b>
                        ${escapeHTML(
                            session.teacher
                        )}
                    </div>

                </div>


                <div class="session-footer">

                    <span
                        class="status ${statusClass}"
                    >
                        ● ${status}
                    </span>

                    ${actionHTML}

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );


    summary.innerHTML =
        sessions.length +
        " subject(s) for your course.";


    if (
        openCount > 0
    ) {

        summary.innerHTML +=
            " " +
            openCount +
            " session(s) currently open.";

    }

}


/* =========================================================
   JOIN SESSION
   ========================================================= */

function joinSession(url) {

    const meetingURL =
        clean(url);


    if (
        !meetingURL ||
        meetingURL === "Meet Link"
    ) {

        alert(
            "Meeting link is not available."
        );

        return;

    }


    window.open(
        meetingURL,
        "_blank"
    );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   LOGOUT
   ========================================================= */

function logout() {

    sessionStorage.removeItem(
        STORAGE_NAME
    );

    sessionStorage.removeItem(
        STORAGE_ID
    );

    sessionStorage.removeItem(
        STORAGE_COURSE
    );

    sessionStorage.removeItem(
        STORAGE_COURSE_ID
    );


    /*
       Remove older StudentLogin keys.
    */

    sessionStorage.removeItem(
        "studentName"
    );

    sessionStorage.removeItem(
        "studentID"
    );

    sessionStorage.removeItem(
        "studentCourse"
    );

    sessionStorage.removeItem(
        "courseID"
    );


    window.location.href =
        "StudentLogin.html";

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadSessions();
