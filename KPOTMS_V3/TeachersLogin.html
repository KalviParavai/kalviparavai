<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Teacher Login - Kalviparavai</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand img {
      width: 85px;
      height: auto;
      margin-bottom: 10px;
    }

    .brand h1 {
      margin: 0;
      color: #0b2a57;
      font-size: 27px;
    }

    .brand h2 {
      margin: 5px 0 0;
      color: #f5a623;
      font-size: 20px;
    }

    .role-label {
      text-align: center;
      margin: 18px 0 25px;
      color: #2b5fb3;
      font-size: 20px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #233;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccd6e5;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2b5fb3;
      box-shadow: 0 0 0 3px rgba(43, 95, 179, 0.10);
    }

    .login-button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2b5fb3;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-button:hover {
      background: #0b2a57;
    }

    .login-button:disabled {
      background: #9aa9bd;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 10px;
      border-radius: 7px;
      text-align: center;
      display: none;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #ffe8e8;
      color: #a00000;
    }

    .success {
      display: block;
      background: #e7f7ed;
      color: #176b36;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #2b5fb3;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 12px;
      color: #2b5fb3;
      font-size: 14px;
    }

  </style>

</head>


<body>


<!-- =====================================================
     KPOTMS V3
     TEACHER LOGIN NAVIGATION GATE
     =====================================================

     Normal route:

         index.html
              ↓
         TeachersLogin.html

     Direct URL without the navigation token:

         TeachersLogin.html
              ↓
         index.html

     Authentication itself is performed by Apps Script.
     ===================================================== -->

<script>

  (function () {

    /*
     * -----------------------------------------------------
     * Already logged in as Teacher?
     * -----------------------------------------------------
     */

    const loggedIn =
      sessionStorage.getItem(
        "kpotmsLoggedIn"
      );

    const role =
      sessionStorage.getItem(
        "kpotmsRole"
      );


    if (
      loggedIn === "true" &&
      role === "TEACHER"
    ) {

      /*
       * Teacher Dashboard will be created next.
       */

      window.location.replace(
        "TeacherDashboard.html"
      );

      return;
    }


    /*
     * -----------------------------------------------------
     * Check whether Teacher Login was opened
     * through the Landing Page.
     * -----------------------------------------------------
     */

    const loginAllowed =
      sessionStorage.getItem(
        "kpotmsTeacherLoginAllowed"
      );


    /*
     * -----------------------------------------------------
     * Direct URL entry without permission
     * -----------------------------------------------------
     */

    if (
      loginAllowed !== "true"
    ) {

      window.location.replace(
        "index.html"
      );

      return;
    }


    /*
     * -----------------------------------------------------
     * Consume navigation token.
     * -----------------------------------------------------
     */

    sessionStorage.removeItem(
      "kpotmsTeacherLoginAllowed"
    );

  })();

</script>



<div class="login-container">


  <div class="login-card">


    <!-- =================================================
         BRAND
         ================================================= -->

    <div class="brand">

      <img
        src="images/logo.png"
        alt="Kalviparavai Logo"
      >

      <h1>
        Kalviparavai
      </h1>

      <h2>
        Digital Class Room
      </h2>

    </div>



    <!-- =================================================
         ROLE
         ================================================= -->

    <div class="role-label">
      Teacher Login
    </div>



    <!-- =================================================
         LOGIN FORM
         ================================================= -->

    <form id="teacherLoginForm">


      <!-- Subject Code -->

      <div class="form-group">

        <label for="subjectCode">
          Subject Code
        </label>

        <input
          type="number"
          id="subjectCode"
          name="subjectCode"
          placeholder="Enter Subject Code"
          required
          min="1"
        >

      </div>



      <!-- Password -->

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter Password"
          required
        >

      </div>



      <!-- Login Button -->

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        LOGIN
      </button>


    </form>



    <!-- Loading -->

    <div
      id="loadingMessage"
      class="loading"
    >
      Verifying Teacher Login...
    </div>



    <!-- Message -->

    <div
      id="message"
      class="message"
      aria-live="polite"
    ></div>



    <!-- =================================================
         BACK TO HOME
         ================================================= -->

    <a
      href="index.html"
      class="back-link"
    >
      ← Back to Kalviparavai Home
    </a>


  </div>

</div>



<script>


/* ==========================================================
   KPOTMS V3.0
   TEACHER LOGIN

   GitHub Pages
        ↓
   TeachersLogin.html
        ↓
   Apps Script Web App
        ↓
   WebAPI.gs
        ↓
   loginTeacher()
        ↓
   Auth.gs
        ↓
   role = TEACHER
   ========================================================== */


/* ==========================================================
   VERSION 10 WEB APP URL
   ========================================================== */

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbwC2PHcaVlF0X0vB8mOVB1Vek_QC7mnI4m_4qXKx9iosFuQRQWdUVtSzGozQ8RUw0LO/exec";


/* ==========================================================
   FORM SUBMIT
   ========================================================== */

document
  .getElementById("teacherLoginForm")
  .addEventListener(
    "submit",
    function (event) {

      event.preventDefault();

      loginTeacher();

    }
  );


/* ==========================================================
   LOGIN TEACHER
   ========================================================== */

async function loginTeacher() {


  const subjectCode =
    document
      .getElementById("subjectCode")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value
      .trim();


  if (
    subjectCode === "" ||
    password === ""
  ) {

    showMessage(
      "Subject Code and Password are required.",
      "error"
    );

    return;
  }


  setLoading(true);


  /*
   * --------------------------------------------------------
   * Remove any previous Teacher session.
   * --------------------------------------------------------
   */

  clearTeacherSession();


  /*
   * --------------------------------------------------------
   * Request sent to Apps Script Web App.
   * --------------------------------------------------------
   */

  const request = {

    action: "loginTeacher",

    subjectCode: subjectCode,

    password: password

  };


  try {


    /* ------------------------------------------------------
       POST request
       ------------------------------------------------------ */

    const response =
      await fetch(
        WEB_APP_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(request)
        }
      );


    /* ------------------------------------------------------
       Read response
       ------------------------------------------------------ */

    const responseText =
      await response.text();


    console.log(
      "Teacher Login Response:",
      responseText
    );


    let result;


    try {

      result =
        JSON.parse(responseText);

    }

    catch (parseError) {

      console.error(
        "Invalid JSON response:",
        responseText
      );

      throw new Error(
        "Invalid response received from KPOTMS server."
      );
    }


    /* ------------------------------------------------------
       Authentication failure
       ------------------------------------------------------ */

    if (
      !result ||
      result.login !== true
    ) {

      showMessage(
        result && result.reason
          ? result.reason
          : "Teacher Login failed.",
        "error"
      );

      setLoading(false);

      return;
    }


    /* ======================================================
       ROLE VERIFICATION
       ======================================================

       Login success is NOT enough.

       Teacher portal requires:

           role === "TEACHER"

       ====================================================== */

    if (
      result.role !== "TEACHER"
    ) {

      console.error(
        "Unexpected role:",
        result.role
      );

      showMessage(
        "Access denied. Teacher role verification failed.",
        "error"
      );

      setLoading(false);

      return;
    }


    /* ======================================================
       STORE AUTHENTICATED TEACHER SESSION
       ====================================================== */

    sessionStorage.setItem(
      "kpotmsLoggedIn",
      "true"
    );


    sessionStorage.setItem(
      "kpotmsRole",
      "TEACHER"
    );


    sessionStorage.setItem(
      "kpotms_subjectCode",
      String(
        result.subjectCode || ""
      )
    );


    sessionStorage.setItem(
      "kpotms_teacherName",
      String(
        result.teacherName || ""
      )
    );


    sessionStorage.setItem(
      "kpotms_courseID",
      String(
        result.courseID || ""
      )
    );


    sessionStorage.setItem(
      "kpotms_subjectName",
      String(
        result.subjectName || ""
      )
    );


    sessionStorage.setItem(
      "kpotms_meetingURL",
      String(
        result.meetingURL || ""
      )
    );


    sessionStorage.setItem(
      "kpotms_sessionStatus",
      String(
        result.sessionStatus || ""
      )
    );


    /* ------------------------------------------------------
       Success
       ------------------------------------------------------ */

    showMessage(
      "Login successful. Opening Teacher Portal...",
      "success"
    );


    setLoading(false);


    /*
     * TeacherDashboard.html will be created next.
     */

    setTimeout(
      function () {

        window.location.replace(
          "TeacherDashboard.html"
        );

      },
      700
    );


  }

  catch (error) {

    console.error(
      "Teacher Login Error:",
      error
    );


    showMessage(
      "Unable to connect to KPOTMS server. Please try again.",
      "error"
    );


    setLoading(false);

  }

}


/* ==========================================================
   CLEAR TEACHER SESSION
   ========================================================== */

function clearTeacherSession() {


  sessionStorage.removeItem(
    "kpotmsLoggedIn"
  );


  sessionStorage.removeItem(
    "kpotmsRole"
  );


  sessionStorage.removeItem(
    "kpotms_subjectCode"
  );


  sessionStorage.removeItem(
    "kpotms_teacherName"
  );


  sessionStorage.removeItem(
    "kpotms_courseID"
  );


  sessionStorage.removeItem(
    "kpotms_subjectName"
  );


  sessionStorage.removeItem(
    "kpotms_meetingURL"
  );


  sessionStorage.removeItem(
    "kpotms_sessionStatus"
  );

}


/* ==========================================================
   MESSAGE
   ========================================================== */

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " + type;

}


/* ==========================================================
   LOADING
   ========================================================== */

function setLoading(
  isLoading
) {

  const button =
    document.getElementById(
      "loginButton"
    );


  const loading =
    document.getElementById(
      "loadingMessage"
    );


  button.disabled =
    isLoading;


  loading.style.display =
    isLoading
      ? "block"
      : "none";


  if (isLoading) {

    button.textContent =
      "VERIFYING...";

  }

  else {

    button.textContent =
      "LOGIN";

  }

}

</script>


</body>

</html>
