<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalviparavai - Coordinator Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(
        135deg,
        #0D47A1,
        #1976D2,
        #00ACC1,
        #43A047
    );

    background-size:400% 400%;

    animation:bgmove 15s ease infinite;

}

@keyframes bgmove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

.login-card{

    width:400px;

    max-width:92%;

    background:white;

    border-radius:20px;

    padding:35px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.30);

}

.logo{

    font-size:65px;

}

.title{

    color:#1565C0;

    font-size:30px;

    font-weight:bold;

    margin-top:10px;

}

.subtitle{

    color:#666;

    margin-top:6px;

    margin-bottom:25px;

}

input{

    width:100%;

    padding:14px;

    margin:10px 0;

    border:1px solid #ccc;

    border-radius:10px;

    font-size:16px;

}

input:focus{

    outline:none;

    border-color:#1565C0;

}

.login-button{

    width:100%;

    padding:15px;

    margin-top:15px;

    border:none;

    border-radius:10px;

    background:#1565C0;

    color:white;

    font-size:18px;

    cursor:pointer;

}

.login-button:hover{

    background:#0D47A1;

}

#error{

    margin-top:15px;

    color:red;

    font-weight:bold;

}

.footer{

    margin-top:20px;

    color:#888;

    font-size:13px;

}

</style>

</head>


<body>


<div class="login-card">

    <div class="logo">🦜</div>

    <div class="title">
        KALVIPARAVAI
    </div>

    <div class="subtitle">
        Coordinator Login
    </div>


    <input
        type="text"
        id="userid"
        placeholder="User ID"
        autocomplete="username"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <button
        class="login-button"
        onclick="login()"
    >
        LOGIN
    </button>


    <div id="error"></div>


    <div class="footer">
        KPOTMS Version 3.0
    </div>

</div>


<script>

/* =====================================================
   KPOTMS V3.0
   Coordinator Login

   Google Sheet:
   02_Coordinator

   Columns:
   A = CoordinatorID
   B = Name
   C = UserID
   D = Password
   E = Active
   ===================================================== */


    const csvURL ="https://docs.google.com/spreadsheets/d/e/2PACX-1vSJxSOEW0y5LERF7KJQKN-ivKxL9D_1tbX9S09kAvn_jTw7719AZInIgGYwd3ent-IX4ky11N2TrS4s/pub?gid=247052099&single=true&output=csv";

    async function login(){

    const userid =
        document.getElementById("userid")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value
        .trim();


    document.getElementById("error").innerHTML = "";


    if(userid === "" || password === ""){

        document.getElementById("error").innerHTML =
            "Please enter User ID and Password.";

        return;

    }


    try{

        const response = await fetch(csvURL);

        const csv = await response.text();

        const rows = csv.split(/\r?\n/);


        for(let i = 1; i < rows.length; i++){

            if(rows[i].trim() === ""){
                continue;
            }


            const cols = rows[i].split(",");


            const coordinatorID =
                (cols[0] || "")
                .replace(/"/g,"")
                .trim();


            const name =
                (cols[1] || "")
                .replace(/"/g,"")
                .trim();


            const user =
                (cols[2] || "")
                .replace(/"/g,"")
                .trim();


            const pass =
                (cols[3] || "")
                .replace(/"/g,"")
                .trim();


            const active =
                (cols[4] || "")
                .replace(/"/g,"")
                .trim()
                .toUpperCase();


            if(
                user === userid &&
                pass === password &&
                active === "Y"
            ){

                sessionStorage.setItem(
                    "coordinatorID",
                    coordinatorID
                );

                sessionStorage.setItem(
                    "coordinatorName",
                    name
                );

                sessionStorage.setItem(
                    "coordinatorUserID",
                    user
                );


                window.location.href =
                    "CoordinatorDashboard.html";

                return;

            }

        }


        document.getElementById("error").innerHTML =
            "Invalid User ID or Password.";


    }
    catch(error){

        document.getElementById("error").innerHTML =
            "Unable to connect to Coordinator Database.";

    }

}

</script>

</body>

</html>
