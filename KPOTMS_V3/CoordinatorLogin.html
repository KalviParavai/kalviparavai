<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Kalviparavai - Coordinator Login</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Font Awesome -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    rel="stylesheet">

  <!-- KPOTMS V3 Common CSS -->
  <link
    href="css/style.css"
    rel="stylesheet">


  <style>

    /* =====================================================
       KPOTMS V3
       COORDINATOR LOGIN
       ===================================================== */

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(
        135deg,
        #ffffff 0%,
        #eef5ff 100%
      );
      color: #233;
    }


    /* -----------------------------------------------------
       Top Header
       ----------------------------------------------------- */

    .login-header {
      background: #ffffff;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);
      padding: 15px 0;
    }


    .brand-area {
      display: flex;
      align-items: center;
      text-decoration: none;
    }


    .brand-area img {
      width: 65px;
      height: auto;
      margin-right: 12px;
    }


    .brand-name {
      margin: 0;
      color: #0b2a57;
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.1;
    }


    .brand-subtitle {
      color: #f5a623;
      font-size: 1rem;
      font-weight: 600;
    }


    /* -----------------------------------------------------
       Main Login Area
       ----------------------------------------------------- */

    .login-area {
      min-height: calc(100vh - 105px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 15px;
    }


    .login-card {
      width: 100%;
      max-width: 470px;
      background: #ffffff;
      border-radius: 22px;
      padding: 38px 40px;
      box-shadow:
        0 15px 45px rgba(11, 42, 87, 0.14);
      border-top: 6px solid #f5a623;
    }


    .login-icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 18px auto;
      border-radius: 50%;
      background: #eef5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0d6efd;
      font-size: 34px;
    }


    .login-title {
      text-align: center;
      color: #0b2a57;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 5px;
    }


    .login-subtitle {
      text-align: center;
      color: #6c757d;
      margin-bottom: 30px;
    }


    /* -----------------------------------------------------
       Form
       ----------------------------------------------------- */

    .form-label {
      font-weight: 600;
      color: #0b2a57;
    }


    .input-group-text {
      background: #eef5ff;
      color: #0d6efd;
      border-color: #ced4da;
    }


    .form-control {
      min-height: 48px;
      border-radius: 0 8px 8px 0;
    }


    .login-button {
      width: 100%;
      min-height: 50px;
      border: none;
      border-radius: 9px;
      background: #0d6efd;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 10px;
      transition: 0.2s ease;
    }


    .login-button:hover {
      background: #0b5ed7;
      transform: translateY(-1px);
    }


    .login-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }


    /* -----------------------------------------------------
       Messages
       ----------------------------------------------------- */

    #messageBox {
      min-height: 25px;
      margin-top: 18px;
      text-align: center;
      font-weight: 600;
    }


    .success-message {
      color: #16803c;
    }


    .error-message {
      color: #c62828;
    }


    /* -----------------------------------------------------
       Footer Links
       ----------------------------------------------------- */

    .login-footer {
      text-align: center;
      margin-top: 25px;
    }


    .login-footer a {
      text-decoration: none;
      font-weight: 600;
    }


    .home-link {
      color: #0d6efd;
    }


    .home-link:hover {
      text-decoration: underline;
    }


    .version-text {
      color: #777;
      font-size: 0.85rem;
      margin-top: 12px;
    }


    /* -----------------------------------------------------
       Mobile
       ----------------------------------------------------- */

    @media (max-width: 576px) {

      .login-card {
        padding: 30px 22px;
      }

      .brand-name {
        font-size: 1.4rem;
      }

      .brand-subtitle {
        font-size: 0.85rem;
      }

      .brand-area img {
        width: 52px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="login-header">

    <div class="container">

      <a
        href="index.html"
        class="brand-area">

        <img
          src="images/logo.png"
          alt="Kalviparavai Logo">

        <div>

          <h1 class="brand-name">
            Kalviparavai
          </h1>

          <div class="brand-subtitle">
            Digital Class Room
          </div>

        </div>

      </a>

    </div>

  </header>



  <!-- =====================================================
       LOGIN AREA
       ===================================================== -->

  <main class="login-area">

    <div class="login-card">


      <!-- Icon -->

      <div class="login-icon">

        <i class="fa-solid fa-user-tie"></i>

      </div>


      <!-- Title -->

      <h2 class="login-title">
        Coordinator Login
      </h2>


      <p class="login-subtitle">
        KPOTMS Coordinator Portal
      </p>



      <!-- =================================================
           LOGIN FORM
           ================================================= -->

      <form
        id="coordinatorLoginForm"
        onsubmit="return loginCoordinator(event);">


        <!-- User ID -->

        <div class="mb-3">

          <label
            for="userID"
            class="form-label">

            User ID

          </label>


          <div class="input-group">

            <span class="input-group-text">

              <i class="fa-solid fa-user"></i>

            </span>


            <input
              type="text"
              id="userID"
              class="form-control"
              placeholder="Enter User ID"
              autocomplete="username"
              required>

          </div>

        </div>



        <!-- Password -->

        <div class="mb-3">

          <label
            for="password"
            class="form-label">

            Password

          </label>


          <div class="input-group">

            <span class="input-group-text">

              <i class="fa-solid fa-lock"></i>

            </span>


            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Enter Password"
              autocomplete="current-password"
              required>

          </div>

        </div>



        <!-- Login Button -->

        <button
          type="submit"
          id="loginButton"
          class="login-button">

          <i class="fa-solid fa-right-to-bracket me-2"></i>

          LOGIN

        </button>


      </form>



      <!-- Message -->

      <div
        id="messageBox"
        aria-live="polite">
      </div>



      <!-- Footer -->

      <div class="login-footer">

        <a
          href="index.html"
          class="home-link">

          <i class="fa-solid fa-house me-1"></i>

          Back to Home

        </a>


        <div class="version-text">

          KPOTMS Version 3.0

        </div>

      </div>


    </div>

  </main>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    /* =====================================================
       KPOTMS V3
       COORDINATOR LOGIN

       Authentication chain:

       Browser
          ↓
       Apps Script Web App
          ↓
       WebAPI.gs
          ↓
       Auth.gs
          ↓
       loginCoordinator()
          ↓
       role = COORDINATOR
       ===================================================== */


    /*
     * -----------------------------------------------------
     * KPOTMS V3 Web App URL
     *
     * IMPORTANT:
     * Replace the value below with the
     * VERSION 10 Web App URL that you copied.
     * -----------------------------------------------------
     */

    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbwC2PHcaVlF0X0vB8mOVB1Vek_QC7mnI4m_4qXKx9iosFuQRQWdUVtSzGozQ8RUw0LO/exec";



    /* =====================================================
       LOGIN FUNCTION
       ===================================================== */

    async function loginCoordinator(event) {

      event.preventDefault();


      const userID =
        document
          .getElementById("userID")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value
          .trim();


      const loginButton =
        document
          .getElementById("loginButton");


      const messageBox =
        document
          .getElementById("messageBox");



      /*
       * ---------------------------------------------------
       * Clear previous message
       * ---------------------------------------------------
       */

      messageBox.textContent = "";

      messageBox.className = "";



      /*
       * ---------------------------------------------------
       * Validate input
       * ---------------------------------------------------
       */

      if (
        userID === "" ||
        password === ""
      ) {

        messageBox.className =
          "error-message";

        messageBox.textContent =
          "Please enter User ID and Password.";

        return false;

      }



      /*
       * ---------------------------------------------------
       * Show processing status
       * ---------------------------------------------------
       */

      loginButton.disabled = true;

      loginButton.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin me-2"></i>' +
        'Checking Login...';



      /*
       * ---------------------------------------------------
       * API Request
       * ---------------------------------------------------
       */

      const request = {

        action:
          "loginCoordinator",

        userID:
          userID,

        password:
          password

      };



      try {


        const response =
          await fetch(

            WEB_APP_URL,

            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify(request)

            }

          );



        /*
         * -------------------------------------------------
         * Read API response
         * -------------------------------------------------
         */

        const responseText =
          await response.text();


        let result;


        try {

          result =
            JSON.parse(responseText);

        }

        catch (parseError) {

          throw new Error(
            "Invalid response received from server."
          );

        }



        /*
         * -------------------------------------------------
         * Authentication failed
         * -------------------------------------------------
         */

        if (
          !result.login
        ) {

          messageBox.className =
            "error-message";

          messageBox.textContent =
            result.reason ||
            result.message ||
            "Invalid User ID or Password.";


          loginButton.disabled = false;

          loginButton.innerHTML =
            '<i class="fa-solid fa-right-to-bracket me-2"></i>' +
            'LOGIN';


          return false;

        }



        /*
         * -------------------------------------------------
         * ROLE VERIFICATION
         * -------------------------------------------------
         *
         * Successful credentials alone are NOT enough.
         *
         * The returned role MUST be:
         *
         *     COORDINATOR
         *
         * -------------------------------------------------
         */

        if (
          result.role !==
          "COORDINATOR"
        ) {

          console.error(
            "Unexpected role:",
            result.role
          );


          messageBox.className =
            "error-message";

          messageBox.textContent =
            "Access denied. Coordinator role verification failed.";


          loginButton.disabled = false;

          loginButton.innerHTML =
            '<i class="fa-solid fa-right-to-bracket me-2"></i>' +
            'LOGIN';


          return false;

        }



        /*
         * -------------------------------------------------
         * Successful Coordinator Login
         * -------------------------------------------------
         */

        sessionStorage.setItem(
          "kpotmsLoggedIn",
          "true"
        );


        sessionStorage.setItem(
          "kpotmsRole",
          "COORDINATOR"
        );


        sessionStorage.setItem(
          "coordinatorID",
          String(
            result.coordinatorID || ""
          )
        );


        sessionStorage.setItem(
          "coordinatorUserID",
          String(
            result.userID || ""
          )
        );


        sessionStorage.setItem(
          "coordinatorName",
          String(
            result.userName || ""
          )
        );



        /*
         * -------------------------------------------------
         * Success message
         * -------------------------------------------------
         */

        messageBox.className =
          "success-message";

        messageBox.textContent =
          "Login successful. Opening Coordinator Dashboard...";


        loginButton.innerHTML =
          '<i class="fa-solid fa-circle-check me-2"></i>' +
          'LOGIN SUCCESSFUL';



        /*
         * -------------------------------------------------
         * Redirect
         * -------------------------------------------------
         */

        setTimeout(

          function() {

            window.location.href =
              "CoordinatorDashboard.html";

          },

          700

        );



      }

      catch (error) {

        console.error(
          "Coordinator Login Error:",
          error
        );


        messageBox.className =
          "error-message";

        messageBox.textContent =
          "Unable to connect to KPOTMS server. Please try again.";


        loginButton.disabled = false;

        loginButton.innerHTML =
          '<i class="fa-solid fa-right-to-bracket me-2"></i>' +
          'LOGIN';

      }


      return false;

    }

  </script>


</body>

</html>
