<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kalviparavai - Coordinator Login</title>

<style>
<script>

const csvURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSJxSOEW0y5LERF7KJQKN-ivKxL9D_1tbX9S09kAvn_jTw7719AZInIgGYwd3ent-IX4ky11N2TrS4s/pub?gid=247052099&single=true&output=csv";


async function login() {

    const userid =
        document.getElementById("userid")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value
        .trim();

    const errorBox =
        document.getElementById("error");

    errorBox.textContent = "";
    errorBox.style.color = "red";


    if (userid === "" || password === "") {

        errorBox.textContent =
            "Please enter User ID and Password.";

        return;
    }


    try {

        const response = await fetch(csvURL);

        const csv = await response.text();


        if (!csv || csv.trim() === "") {

            throw new Error("Empty CSV");

        }


        const rows =
            csv.split(/\r?\n/);


        for (let i = 1; i < rows.length; i++) {

            if (rows[i].trim() === "") {
                continue;
            }


            /*
             * 02_Coordinator columns:
             *
             * A = CoordinatorID
             * B = Name
             * C = UserID
             * D = Password
             * E = Active
             */

            const cols =
                rows[i]
                .split(",")
                .map(value =>
                    value
                    .replace(/^"|"$/g, "")
                    .trim()
                );


            const coordinatorID = cols[0] || "";
            const name          = cols[1] || "";
            const user          = cols[2] || "";
            const pass          = cols[3] || "";
            const active        = (cols[4] || "")
                                  .toUpperCase();


            if (
                user === userid &&
                pass === password &&
                active === "Y"
            ) {


                sessionStorage.setItem(
                    "coordinatorID",
                    coordinatorID
                );


                sessionStorage.setItem(
                    "coordinatorName",
                    name
                );


                sessionStorage.setItem(
                    "coordinatorUserID",
                    user
                );


                errorBox.style.color =
                    "#16803c";

                errorBox.textContent =
                    "Login successful. Coordinator Dashboard ready.";

                return;
            }

        }


        errorBox.style.color = "red";

        errorBox.textContent =
            "Invalid User ID or Password.";

    }


    catch (error) {

        console.error(error);

        errorBox.style.color = "red";

        errorBox.textContent =
            "Unable to connect to Coordinator Database.";

    }

}

</script>
</style>

</head>


<body>


<div class="login-card">


    <div class="logo">
        🦜
    </div>


    <div class="title">
        KALVIPARAVAI
    </div>


    <div class="subtitle">
        Coordinator Login
    </div>


    <input
        type="text"
        id="userid"
        placeholder="User ID"
        autocomplete="username"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <button
        class="login-button"
        onclick="login()"
    >
        LOGIN
    </button>


    <div id="error"></div>


    <div class="footer">
        KPOTMS Version 3.0
    </div>


</div>


<script>

/* =====================================================
   KPOTMS V3.0
   COORDINATOR LOGIN

   Sheet:
   02_Coordinator

   Columns:
   A - CoordinatorID
   B - Name
   C - UserID
   D - Password
   E - Active
   ===================================================== */


const csvURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSJxSOEW0y5LERF7KJQKN-ivKxL9D_1tbX9S09kAvn_jTw7719AZInIgGYwd3ent-IX4ky11N2TrS4s/pub?gid=247052099&single=true&output=csv";


async function login() {


    const userid =
        document.getElementById("userid")
        .value
        .trim();


    const password =
        document.getElementById("password")
        .value
        .trim();


    document.getElementById("error")
        .textContent = "";


    if (userid === "" || password === "") {

        document.getElementById("error")
            .textContent =
            "Please enter User ID and Password.";

        return;

    }


    try {


        const response =
            await fetch(csvURL);


        if (!response.ok) {

            throw new Error(
                "Unable to read Coordinator data."
            );

        }


        const csv =
            await response.text();


        const rows =
            csv.split(/\r?\n/);


        for (let i = 1; i < rows.length; i++) {


            if (rows[i].trim() === "") {
                continue;
            }


            const cols =
                rows[i].split(",");


            const coordinatorID =
                (cols[0] || "")
                .replace(/"/g, "")
                .trim();


            const name =
                (cols[1] || "")
                .replace(/"/g, "")
                .trim();


            const user =
                (cols[2] || "")
                .replace(/"/g, "")
                .trim();


            const pass =
                (cols[3] || "")
                .replace(/"/g, "")
                .trim();


            const active =
                (cols[4] || "")
                .replace(/"/g, "")
                .trim()
                .toUpperCase();


            if (
                user === userid &&
                pass === password &&
                active === "Y"
            ) {


                sessionStorage.setItem(
                    "coordinatorID",
                    coordinatorID
                );


                sessionStorage.setItem(
                    "coordinatorName",
                    name
                );


                sessionStorage.setItem(
                    "coordinatorUserID",
                    user
                );


                /*
                 * Dashboard will be created next.
                 *
                 * For the moment we show a
                 * successful-login message.
                 */

                document.getElementById("error")
                    .style.color = "#16803c";


                document.getElementById("error")
                    .textContent =
                    "Login successful. Coordinator Dashboard ready.";


                return;

            }

        }


        document.getElementById("error")
            .style.color = "red";


        document.getElementById("error")
            .textContent =
            "Invalid User ID or Password.";


    }

    catch (error) {


        document.getElementById("error")
            .style.color = "red";


        document.getElementById("error")
            .textContent =
            "Unable to connect to Coordinator Database.";


        console.error(error);

    }

}

</script>


</body>

</html>
