<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPOTMS API Test</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin:40px;
        }

        button{
            padding:10px 20px;
            font-size:16px;
            cursor:pointer;
        }

        pre{
            margin-top:20px;
            background:#f4f4f4;
            border:1px solid #ccc;
            padding:15px;
            white-space:pre-wrap;
            word-wrap:break-word;
        }
    </style>

</head>

<body>

<h2>KPOTMS API Test</h2>

<button id="btnTest">
    Test Coordinator Login
</button>

<pre id="result">Waiting...</pre>

<script>

const WEBAPP =
"https://script.google.com/macros/s/AKfycbzzUc90911Fzt8NY2NU-iM2nFCIHHk5Sydt-MV2PRGiT5a_0kwQPJr6le_18QBXcD-q/exec";


document
.getElementById("btnTest")
.addEventListener("click", testLogin);


async function testLogin(){

    const output =
        document.getElementById("result");

    output.textContent = "Connecting to Web API...";

    try{

        const response = await fetch(WEBAPP,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                action:"loginCoordinator",

                userID:"admin",

                password:"admin@123"

            })

        });

        const responseText =
            await response.text();

        output.textContent =

            "HTTP Status : "
            + response.status

            + "\n\n"

            + responseText;

    }
    catch(error){

        output.textContent =

            "ERROR\n\n"

            + error;

    }

}

</script>

</body>

</html>
