<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KPOTMS Jitsi Prototype</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0D47A1, #1976D2, #00ACC1);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    background: white;
    padding: 15px 25px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.2);
}

.header h1 {
    color: #1565C0;
    font-size: 26px;
}

.header p {
    color: #666;
    margin-top: 4px;
}

.meeting-container {
    flex: 1;
    padding: 15px;
}

#meet {
    width: 100%;
    height: calc(100vh - 110px);
    background: #000;
    border-radius: 12px;
    overflow: hidden;
}
</style>

</head>

<body>

<div class="header">

    <h1>🦜 KALVIPARAVAI</h1>

    <p>KPOTMS Jitsi Prototype — Test 1</p>

</div>

<div class="meeting-container">

    <div id="meet"></div>

</div>

<script src="https://meet.jit.si/external_api.js"></script>

<script>

const domain = "meet.jit.si";

const options = {

    roomName: "KPOTMS_Test_Room_2026",

    width: "100%",

    height: "100%",

    parentNode: document.querySelector("#meet"),

    userInfo: {

        displayName: "KPOTMS Test User"

    }

};

const api = new JitsiMeetExternalAPI(
    domain,
    options
);

</script>

</body>
</html>
