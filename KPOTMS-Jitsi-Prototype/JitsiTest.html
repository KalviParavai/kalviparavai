<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>KPOTMS Jitsi Prototype - Test 3</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f2f6fa;
}

.header {
    background: #1565c0;
    color: white;
    text-align: center;
    padding: 16px;
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.header p {
    margin: 5px 0 0;
    font-size: 14px;
}

.controls {
    background: white;
    padding: 15px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.controls button {
    margin: 5px;
    padding: 12px 20px;
    border: none;
    border-radius: 7px;
    background: #1976d2;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.controls button:hover {
    background: #0d47a1;
}

#roomTitle {
    text-align: center;
    margin: 12px;
    font-size: 20px;
    font-weight: bold;
    color: #333;
}

#meet {
    width: 100%;
    height: calc(100vh - 180px);
    min-height: 500px;
    background: black;
}

</style>

</head>

<body>

<div class="header">

    <h1>🦜 KALVIPARAVAI</h1>

    <p>KPOTMS Jitsi Prototype — Test 3</p>

</div>


<div class="controls">

    <button onclick="openRoom(
        'KPOTMS_X_Physics_2026',
        'X Physics',
        'Teacher A'
    )">
        X Physics
    </button>


    <button onclick="openRoom(
        'KPOTMS_XI_Biology_2026',
        'XI Biology',
        'Teacher B'
    )">
        XI Biology
    </button>


    <button onclick="openRoom(
        'KPOTMS_XII_Computer_Science_2026',
        'XII Computer Science',
        'Teacher C'
    )">
        XII Computer Science
    </button>

</div>


<div id="roomTitle">
    Select a subject to start the test.
</div>


<div id="meet"></div>


<script src="https://meet.jit.si/external_api.js"></script>


<script>

let api = null;


function openRoom(
    roomName,
    subjectName,
    teacherName
) {

    /*
     * If another room is already open
     * in this browser window, dispose it.
     */

    if (api) {

        api.dispose();

        api = null;

    }


    /*
     * Display current room information.
     */

    document.getElementById(
        "roomTitle"
    ).innerText =
        subjectName +
        " — " +
        teacherName;


    /*
     * Create Jitsi meeting.
     */

    const options = {

        roomName: roomName,

        width: "100%",

        height: "100%",

        parentNode:
            document.querySelector("#meet"),

        userInfo: {

            displayName:
                teacherName

        }

    };


    api =
        new JitsiMeetExternalAPI(
            "meet.jit.si",
            options
        );


    /*
     * Basic test messages.
     */

    api.addEventListener(
        "videoConferenceJoined",
        function(event) {

            console.log(
                "Joined:",
                subjectName,
                event
            );

        }
    );


    api.addEventListener(
        "videoConferenceLeft",
        function(event) {

            console.log(
                "Left:",
                subjectName,
                event
            );

        }
    );

}

</script>

</body>

</html>
